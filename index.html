const KF={com:[{l:50,s:'duelist'},{l:50,s:'quick healer'},{l:70,s:'deadeye'},{l:110,s:'toughness'},{l:135,s:'iron wall'},{l:150,s:'advanced disarm'}],pil:[{l:100,s:'navigator'},{l:145,s:'evading'},{l:150,s:'precision'}],eng:[{l:50,s:'armor crafting'},{l:130,s:'droid making'},{l:130,s:'structure building'},{l:145,s:'ship building'}],hun:[{l:100,s:'increasedresistance'},{l:120,s:'endurance'}],smu:[{l:60,s:'sticky fingers'},{l:80,s:'slippery'},{l:95,s:'reflexes'},{l:100,s:'masquerader'},{l:100,s:'transport specialist'},{l:130,s:'enduring facade'},{l:135,s:'silent sneak'}],lea:[{l:50,s:'salesman'},{l:80,s:'communicator'},{l:80,s:'valor'},{l:90,s:'refresh'},{l:120,s:'rally'},{l:130,s:'morale'},{l:140,s:'fortify'},{l:140,s:'master communicator'},{l:150,s:'inspirecrime'}],esp:[{l:100,s:'camera avoidance'},{l:150,s:'minesweeper'}],sli:[{l:150,s:'disrupt network'},{l:150,s:'ping ship'}],med:[{l:140,s:'cybernetic expert'}],sci:[{l:50,s:'scientific mind'}]};

const rSel=document.getElementById('rSel');
const mSel=document.getElementById('mSel');
const fSel=document.getElementById('fSel');
Object.keys(R).sort().forEach(n=>{
  const o=document.createElement('option');
  o.value=n;
  o.textContent=n+(R[n].apponly==='Yes'?' [App]':'');
  rSel.appendChild(o);
});
rSel.selectedIndex=0;

function switchTab(id){
  document.getElementById('skillsPanel').style.display=id==='skills'?'block':'none';
  document.getElementById('featsPanel').style.display=id==='feats'?'block':'none';
  document.getElementById('tabSkills').style.cssText='padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid '+(id==='skills'?'#555;background:#2a2a2a;color:#ddd':'#333;background:#1a1a1a;color:#888');
  document.getElementById('tabFeats').style.cssText='padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid '+(id==='feats'?'#555;background:#2a2a2a;color:#ddd':'#333;background:#1a1a1a;color:#888');
}

function render(){
  const rn=rSel.value,mn=mSel.value,fc=fSel.value;
  const race=R[rn];if(!race)return;
  const base=race.levels[mn]||{};
  const bonus=FB[fc]||{};
  const fin={};
  SK.forEach(k=>{fin[k]=Math.min(150,(base[k]||0)+(bonus[k]||0));});
  const total=SK.reduce((a,k)=>a+fin[k],0);
  const stats=['str','dex','con','int','wis','cha'];
  const statHtml=stats.map(s=>{const v=race[s];if(!v)return'';const c=v>0?'#1D9E75':'#E24B4A';return`<span style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid ${c};color:${c}">${s.toUpperCase()} ${v>0?'+':''}${v}</span>`;}).join('');
  document.getElementById('sBar').innerHTML=
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:80px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Total levels</div><div style="font-size:20px;font-weight:500">${total}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:70px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">HP</div><div style="font-size:20px;font-weight:500">${race.hp}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:80px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">AC bonus</div><div style="font-size:20px;font-weight:500">${race.ac}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:70px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">FP/level</div><div style="font-size:20px;font-weight:500">${FP[fc]}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:120px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Force ability</div><div style="font-size:13px;padding-top:4px">${FA[fc]}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:100px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Cost</div><div style="font-size:13px;padding-top:4px">${race.price}pt / ${race.deposit}dep</div></div>`;
  document.getElementById('bBadges').innerHTML=statHtml||'<span style="font-size:11px;color:#666">all stats baseline</span>';
  document.getElementById('skGrid').innerHTML=SK.map(sk=>{
    const val=fin[sk],isMain=sk===mn,isBoosted=!!(bonus[sk]);
    const border=isMain?'#1D9E75':isBoosted?'#378ADD':'#2a2a2a';
    const label=SN[sk]+(isMain?' \u2605':isBoosted?' \u2191':'');
    const hits=(KS[sk]||[]).filter(x=>val>=x.l);
    const miss=(KS[sk]||[]).filter(x=>val<x.l).slice(0,3);
    return `<div style="background:#1a1a1a;border:1px solid ${border};border-radius:6px;padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888">${label}</span><span style="font-size:20px;font-weight:500">${val}</span></div><div style="height:3px;background:#2a2a2a;border-radius:2px;margin:3px 0 6px"><div style="height:3px;width:${Math.round(val/150*100)}%;background:${SC[sk]};border-radius:2px"></div></div><div style="font-size:11px;line-height:1.7">${hits.map(u=>`<span style="display:block;color:#bbb">\u2713 ${u.s} (${u.l})</span>`).join('')}${miss.map(u=>`<span style="display:block;color:#444">\u25cb ${u.s} (${u.l})</span>`).join('')}</div></div>`;
  }).join('');
  document.getElementById('ftGrid').innerHTML=SK.filter(sk=>(KF[sk]||[]).length).map(sk=>{
    const val=fin[sk],isMain=sk===mn,isBoosted=!!(bonus[sk]);
    const border=isMain?'#1D9E75':isBoosted?'#378ADD':'#2a2a2a';
    const feats=KF[sk]||[];
    const hits=feats.filter(x=>val>=x.l);
    const miss=feats.filter(x=>val<x.l);
    return `<div style="background:#1a1a1a;border:1px solid ${border};border-radius:6px;padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888">${SN[sk]}</span><span style="font-size:20px;font-weight:500">${val}</span></div><div style="height:3px;background:#2a2a2a;border-radius:2px;margin:3px 0 6px"><div style="height:3px;width:${Math.round(val/150*100)}%;background:${SC[sk]};border-radius:2px"></div></div><div style="font-size:11px;line-height:1.7">${hits.map(u=>`<span style="display:block;color:#EF9F27">\u2605 ${u.s} (${u.l})</span>`).join('')}${miss.map(u=>`<span style="display:block;color:#444">\u25cb ${u.s} (${u.l})</span>`).join('')}</div></div>`;
  }).join('');
}
rSel.addEventListener('change',render);
mSel.addEventListener('change',render);
fSel.addEventListener('change',render);
render();
</script>

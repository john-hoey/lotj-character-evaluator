details of the current public opinion of the given\ngovernment clan as well as their current military presence. Any citizen or\nvendor mob can be used. Using this skill, you'll even see which effects are\ncontributing to public opinion so you know how to best respond to them.\n\nAt a cost of 1,000 credits, this command can be used defensively to bolster\npublic opinion or offensively to get police out of the way and increase crime.\nIf used on a citizen, it will raise opinion of the current government by 0.1.\nIf used on a police mob, the police mob will go away and crime rating will go\nup by 1/3 of a point.\n\nPropaganda allows experienced leaders to sway public opinion however they like.\nIt will raise or lower support by 1/4 of a point with each use, although it may\nfail to convince the target, especially for players with low charisma.\n\nNotes:\n* Mobs will despawn when targeted with bribe or propaganda. To continue your\nefforts, you may need to wait for more mobs to spawn, which happens every 20\nminutes for planetary AI mobs.","s":["smalltalk <citizen/vendor> <clan>","bribe <target>","propaganda <citizen> <for/against> <clan>"],"r":[],"l":70,"c":"Leadership"},"broadcast":{"d":"Level 100 Leadership Skill\n\nRequired:[Broadcast] flagged room, comlink, 50,000 credits.\n\nThis skill is used to broadcast a message to anyone in the galaxy with a\ncomlink. This is a good skill to use for speeches or announcements pertaining\nto the planet it is broadcasted from. You should be careful to set your\ncurrentcomlink to a comlink tuned to channel 0 with no encryption, or it will\nsound all garbled and be useless and unreadable to those without your\nencryption.\n\nThe 50,000 credit fee is deposited directly into the planet's governing clan's\nbank.\n\nThe app-approved Senator of a planet (and possibly other characters at Immortal\ndiscretion) have the right to speak for their citizens in broadcasts. However,\nmost characters do not have this right.\n\nTo avoid godmodding, if your character isn't a Senator or doesn't otherwise\nhave special permission, present your broadcast as your own viewpoint or your\nclan's viewpoint. Don't claim to represent NPCs or be a neutral GNI reporter\nwithout permission! If you aren't sure, immchat your broadcast and ask.","s":["broadcast <message>"],"r":[],"l":100,"c":"Leadership"},"propaganda":{"d":"Level 30, 70 and 110 Leadership Skills\n\nThese are three leadership skills which allow them to manage public opinion on\nplanets. Public opinion is important for maintaining control over a world or\nwhen trying to capture a planet diplomatically.\n\nSmalltalk will reveal details of the current public opinion of the given\ngovernment clan as well as their current military presence. Any citizen or\nvendor mob can be used. Using this skill, you'll even see which effects are\ncontributing to public opinion so you know how to best respond to them.\n\nAt a cost of 1,000 credits, this command can be used defensively to bolster\npublic opinion or offensively to get police out of the way and increase crime.\nIf used on a citizen, it will raise opinion of the current government by 0.1.\nIf used on a police mob, the police mob will go away and crime rating will go\nup by 1/3 of a point.\n\nPropaganda allows experienced leaders to sway public opinion however they like.\nIt will raise or lower support by 1/4 of a point with each use, although it may\nfail to convince the target, especially for players with low charisma.\n\nNotes:\n* Mobs will despawn when targeted with bribe or propaganda. To continue your\nefforts, you may need to wait for more mobs to spawn, which happens every 20\nminutes for planetary AI mobs.","s":["smalltalk <citizen/vendor> <clan>","bribe <target>","propaganda <citizen> <for/against> <clan>"],"r":[],"l":110,"c":"Leadership"},"duplicate":{"d":"Level 1 Espionage Skill\n\nThis skill allows a player to make copies of certain keys and keycards.\n\nRequirements: Toolkit, Datapad, Duraplast, and a key to be copied.","s":["Duplicate <key/keycard>"],"r":[],"l":1,"c":"Espionage"},"swipe":{"d":"Level 20 Espionage Skill\n\nSWIPE attempts to steal credits from a mob or another player. In order to swipe\nsuccessfully, you must practice the skill. On successful attempts you will\ngain a varied amount of credits that is proportional to the total amount of\ncredits held by the target.\n\nYou can also use this command to remove worn items from sleeping/stunned\nplayers.","s":["swipe credits <character>"],"r":[],"l":20,"c":"Espionage"},"tail":{"d":"Level 30 Espionage Skill\n\nThis skill will try to secretly follow the victim. Use TAIL NONE\nif you wish to secretly stop following them.","s":["tail <victim>"],"r":[],"l":30,"c":"Espionage"},"conceal":{"d":"Level 40 Espionage Skill\n\nUsed to attempt to hide an object on the ground. Having sharp\neye or searching will help to find the object.","s":["conceal <object>"],"r":[],"l":40,"c":"Espionage"},"makebinders":{"d":"Level 50 Espionage Skill\n\nThis skill allows players to construct their own bindings to restrain players.\nA feat will soon be added to allow these binders to be locked with keycodes.\n(Yes, I know it prompts you about a circuit board for lockable binders. That is\ncoming soon).\nRequires: Toolkit, circuit board and duraplast or durasteel","s":["makebinders <binder name>"],"r":[],"l":50,"c":"Espionage"},"sabotage":{"d":"Level 60 Espionage Skill\n\nIn an engineroom this command allows you to damage one of the following:\nFuel, Engine, Launcher, Laser, Ion, Cloak","s":["Sabotage <system>"],"r":[],"l":60,"c":"Espionage"},"makecamera":{"d":"Level 75 Espionage Skill\n\nThis skill will create a camera that can be installed in a room and allow\nplayers to monitor it remotely. Creating a camera requires the following parts:\nbattery, circuit, duraplast, lens, toolkit (reusable), oven (reusable), and\nsuperconductor.","s":["makecamera <name of camera>"],"r":[],"l":75,"c":"Espionage"},"install_camera":{"d":"There are three skills relating to the installation and usage of cameras:\n\nINSTALL_CAMERA is simple, using the skill allows a player to install a camera\nitem in their current room using a camera from their inventory. Cameras can\nbe removed from a room by performing a sweep using the CAMERA_SWEEP skill,\nwhich will destroy the camera if one is found. This requires a toolkit.\n\nMONITOR_CAMERA has multiple different functions. Without any input, the skill\nby itself will locate any of the cameras installed on the player's current\nplanet. The player can then select a camera by just using monitor_camera again\nand this time adding the number afterwards.\n\nWhen monitoring a camera, the player will be able to view any activity\noccuring in that room in real time so long as they are not interrupted through\nany of the normal methods. A player can get another look at the room by\nentering \"look datapad\" without having to begin monitoring again. While\nviewing others via camera, conversations cannot be heard in the viewed room.\nUsage of the \"datastat\" command will not interrupt monitor_camera.","s":["install_camera","monitor_camera <number>","camera_sweep"],"r":[],"l":80,"c":"Espionage"},"doorcut":{"d":"Level 85 Espionage skill\n\nA skill that allows you to cut open a door, ship or vehicle hatch.\nThis skill requires you to be holding a fusion cutter.","s":["doorcut <door/ship>"],"r":[],"l":85,"c":"Espionage"},"sharp eye":{"d":"Level 90 Espionage Skill\n\nSHARP EYE is an espionage skill that allows one to notice items that have been\nCONCEALED on the ground.\n\nIt is a passive skill, meaning, that if you've trained it, it will\nautomatically take affect.","s":["Use of this passive skill is automatic once learned."],"r":[],"l":90,"c":"Espionage"},"monitor_camera":{"d":"There are three skills relating to the installation and usage of cameras:\n\nINSTALL_CAMERA is simple, using the skill allows a player to install a camera\nitem in their current room using a camera from their inventory. Cameras can\nbe removed from a room by performing a sweep using the CAMERA_SWEEP skill,\nwhich will destroy the camera if one is found. This requires a toolkit.\n\nMONITOR_CAMERA has multiple different functions. Without any input, the skill\nby itself will locate any of the cameras installed on the player's current\nplanet. The player can then select a camera by just using monitor_camera again\nand this time adding the number afterwards.\n\nWhen monitoring a camera, the player will be able to view any activity\noccuring in that room in real time so long as they are not interrupted through\nany of the normal methods. A player can get another look at the room by\nentering \"look datapad\" without having to begin monitoring again. While\nviewing others via camera, conversations cannot be heard in the viewed room.\nUsage of the \"datastat\" command will not interrupt monitor_camera.","s":["install_camera","monitor_camera <number>","camera_sweep"],"r":[],"l":100,"c":"Espionage"},"camera_sweep":{"d":"There are three skills relating to the installation and usage of cameras:\n\nINSTALL_CAMERA is simple, using the skill allows a player to install a camera\nitem in their current room using a camera from their inventory. Cameras can\nbe removed from a room by performing a sweep using the CAMERA_SWEEP skill,\nwhich will destroy the camera if one is found. This requires a toolkit.\n\nMONITOR_CAMERA has multiple different functions. Without any input, the skill\nby itself will locate any of the cameras installed on the player's current\nplanet. The player can then select a camera by just using monitor_camera again\nand this time adding the number afterwards.\n\nWhen monitoring a camera, the player will be able to view any activity\noccuring in that room in real time so long as they are not interrupted through\nany of the normal methods. A player can get another look at the room by\nentering \"look datapad\" without having to begin monitoring again. While\nviewing others via camera, conversations cannot be heard in the viewed room.\nUsage of the \"datastat\" command will not interrupt monitor_camera.","s":["install_camera","monitor_camera <number>","camera_sweep"],"r":[],"l":120,"c":"Espionage"},"blackjack":{"d":"Level 130 Espionage Skill\n\nThe mother of all non-lethal defenses, Blackjack renders the target\nunconscious, leaving them as easy targets for anything you want to do to them.\nIt can also be used to simply dispose of an annoying guard or officer for a few\nminutes, without altering the local security.\n\nIn order to BLACKJACK, you must be wielding a weapon (Only blasters,\nlightsabers, bowcasters, and force pikes work)\n\nIf the target is wearing any form of head gear, It becomes much harder\nto blackjack them - the higher the helmet's class, the harder it is.","s":["BLACKJACK <target>"],"r":[],"l":130,"c":"Espionage"},"makecutter":{"d":"Level 150 Espionage Skill\n\nNo more of this silly \"my lightsaber is a fusion cutter not a lightsaber\nbecause it says fusion cutter on the label!\" A 150 level espionage skill\n'makecutter' has been implemented to allow master infiltrators the chance to\ncreate their own cutters. In order to craft one, you must be in a refinery.\n\nThe necessary parts are: A toolkit, durasteel or duraplast, a battery, a lens,\na superconductor, a mirror and a circuit.","s":["makecutter <name>"],"r":[],"l":150,"c":"Espionage"},"showclan":{"d":"Level 1 Slicer Skill\n\nRequired Items: A Datapad\n\nDisplay publicly available information about the specified clan. Such\ninformation is considered in-character (IC).","s":["showclan <clan>"],"r":[],"l":1,"c":"Slicer"},"showplanet":{"d":"Level 1 Slicer Skill\n\nRequired Items: A Datapad\n\nDisplay publicly available information about the specified planet. Such\ninformation is considered in-character (IC). Adding 'resources' after the\nplanet name will show available cargo types and prices for that planet. You\ncannot buy or sell resources at a planet that does not have them listed. Adding\n'ai' after the planet name shows advanced information about the planet's\npopular support.\n\nNote: If a planet's name has two words, put them in single quotes.\nExample: showplanet 'Nal Hutta'","s":["showplanet <planet>","showplanet <planet> resources","showplanet <planet> AI"],"r":[],"l":1,"c":"Slicer"},"secure":{"d":"The term \"slicer,\" or \"hacker,\" was used to describe computer experts, often\nself-taught, who excelled at working within a complex computer network, and\nwere able to extract information from this network with great skill.\n                                                     -Wookieepedia\n\nOptions: ship, turbolift\n\nSlice and Secure are used by a slicer to secure and hack computer networks. A\nsecured network is immune to certain types of physical and virtual attacks,\nwhile an unsecured computer can be easy prey to many. The skill of the slicer\ndetermines how secure the system is, and how secure of a system can be sliced.\n\nSlice and Secure generate security ratings. Security ratings are\na letter followed by a number - the letters indicate the most significant\nportion of the rating, and the numbers, the least significant.\n\nFor example, an Aurek-6 rating is lower than an Aurek-7, which is\nlower than a Besh-0. Ratings in the Aurek to Besh range are common.\nRatings in the Cresh band are considered uncommon, and Dorn\nsecurity ratings are very good to excellent.\n\nFor a parked or orbiting ship to experience the benefits of being secured,\nit must be set to autopilot ON.","s":["slice <option>","secure <option>"],"r":[],"l":15,"c":"Slicer"},"slice":{"d":"The term \"slicer,\" or \"hacker,\" was used to describe computer experts, often\nself-taught, who excelled at working within a complex computer network, and\nwere able to extract information from this network with great skill.\n                                                     -Wookieepedia\n\nOptions: ship, turbolift\n\nSlice and Secure are used by a slicer to secure and hack computer networks. A\nsecured network is immune to certain types of physical and virtual attacks,\nwhile an unsecured computer can be easy prey to many. The skill of the slicer\ndetermines how secure the system is, and how secure of a system can be sliced.\n\nSlice and Secure generate security ratings. Security ratings are\na letter followed by a number - the letters indicate the most significant\nportion of the rating, and the numbers, the least significant.\n\nFor example, an Aurek-6 rating is lower than an Aurek-7, which is\nlower than a Besh-0. Ratings in the Aurek to Besh range are common.\nRatings in the Cresh band are considered uncommon, and Dorn\nsecurity ratings are very good to excellent.\n\nFor a parked or orbiting ship to experience the benefits of being secured,\nit must be set to autopilot ON.","s":["slice <option>","secure <option>"],"r":[],"l":15,"c":"Slicer"},"lookup":{"d":"Level 25 Slicer Skill\n\nUsed to scan a player in the same room to view their datafile. This includes\ntheir character's history as well as their clan affiliation and rank if they\nare in a public clan. For instance, a member of the Galactic Republic's rank\nand affiliation would be available, but not a member of the Black Sun, which is\ncommonly a hidden crime clan.\n\nA word of warning, some players may object to you running a background check on\nthem, so it is often considered a good idea to ask their permission first. It\nis also common for clans like The Empire to run identity checks on their\nplanets so if you wish to keep your background or affiliation a secret it is\nwise to do your best to avoid them.","s":["lookup <player name>"],"r":[],"l":25,"c":"Slicer"},"remodulate":{"d":"Level 30 Slicer skill\nRequired Items: 2 Datapads, Circuit, Toolkit\nOptional Items: A Coprocessor\n\nThis will attempt to reprogram one datapad with another. To begin, you\nmust hold the higher leveled datapad.\n\nHigher modulation in your datapad will be required for espionage and slicer\nskills that require datapads. Certain skills require certain modes, and for\nall intents and purposes, the higher the mode you have the better.\n\nThe highest modulation you can create depends on your slicer level.\n\nThe standard remodulations are:\n0. BS1\n1. Medical\n2. ES1\n3. SRK\n4. MSTR\n\nA sufficiently skilled slicer may use datastat to see their datapad's current\nmodulation. It can also be deduced from the datapad's number of message slots.\n\nAs a side note, if you're a slicer and you can get the MSTR setting, or even a\nhigh setting, you don't want to be giving them away, as the higher the\nmodulation the more one can do with it, and thus it is imperative that you do\nnot allow the most powerful of hacked datapads to fall into the hands of the\nless skilled. Think of it as handing out guns as opposed to keeping only one\nfor yourself when everyone else has none.\n\n\"Spec Master\" Modulations\nA Spec Master modulated datapad gives the user an advantage only when slicing a\ncomputer system that corresponds to its type.\n\n5. Turbolift    - Lifthack Skill\n6. Spacecraft   - Slice for Ships\n7. Room         - Disable_Security Skill\n8. Datanet      - Decrypt_File Skill\n\nThese modulations are obtained by incorporating a coprocessor into the\nremodulation process. The location in which a slicer remodulates a datapad with\na coprocessor will be imprinted on the datapad, granting a speed bonus when\nslicing in that specific room.","s":["remodulate <datapad in inventory> <modulation code>"],"r":[],"l":30,"c":"Slicer"},"short":{"d":"Level 30 Slicer Skill\n\nRequired Item(s): A Datapad and toolkit\n\nA slicer can attempt to unlock a keypad-secured door.","s":["short <direction>"],"r":[],"l":30,"c":"Slicer"},"locateship":{"d":"Level 50 Slicer Skill\n\nAllows a player to determine ownership and last docking point information\non starships. Requires a datapad.","s":["Locateship <shipname>"],"r":[],"l":50,"c":"Slicer"},"fakesignal":{"d":"Level 70 Slicer Skill\n\nThis slicer skill allows you to force a ship to open its hangar bays without\nknowing its hangar access codes.\n\nYou must be on the bridge of a ship, and within (500+(comm*10)) units of the\nother vessel. Skill requires 3 rounds to complete.\n\nBe careful! The better your percentage, the more likely on a failure that an\nautopiloted ship will automatically retaliate against you. IE: A failure while\ntrying to access a Star Destroyer might get you scragged!\n\nReminder: Neutral Government capital ships are covered by HELP CAPITALRULES.\nDo not fakesignal these ships.","s":["fakesignal <target ship> <hangar number>"],"r":[],"l":70,"c":"Slicer"},"hack":{"d":"Level 80 Slicer Skill\n\nThis skill will allow a player to attempt to hack a bank account and withdraw a\nportion of its funds. To perform this feat, you must be at a banking terminal.\nBe cautious of the fact that some bank accounts are protected, and hacking\nthese accounts may result in death!\n\nBad things can happen if you hack a protected account, maybe some worse than\ndeath.\n\nFOR THOSE WHO DID NOT KNOW:  HACKING YOUR ALT'S BANK ACCOUNT IS ILLEGAL.","s":["hack <bank account>"],"r":[],"l":80,"c":"Slicer"},"encrypt_file":{"d":"People can use slicing skills to damage their record that appears\nusing the lookup skill. Encrypt_file is used to make it unreadable, and\ndecrypt_file is used to repair it.\n\nThe history display command notes whether your personal file is currently\nencrypted or unencrypted.","s":["encrypt_file <target> OR decrypt_file <target>"],"r":[],"l":90,"c":"Slicer"},"networkhack":{"d":"Level 99 Slicer Skill\n\nRequired: [Comm Junction] flagged room, comlink\n\nThis skill is identical to the 'Broadcast' skill with the exception that it\nallows you to utilize your slicer ability to bypass the 50000 credit cost.","s":["networkhack <message>"],"r":[],"l":99,"c":"Slicer"},"disable_security":{"d":"Level 100 Slicer Skills\n\nA trained slicer can enable security in a room, creating an alarm system that\nwill notify the planet's governing organization of shady activity.\n\nDisable_security is used to disable the alarms, allowing a thief to work\nin relative peace.\n\nSlicers over level 140 will notice a [Security] tag in rooms that have been\nsecured.\n\nSkills that will trip an alarm - hack, short, lifthack, tapdata, breach,\ndoorcut, disable_security, doorbash, slice, pirateship, trafficking, explosions","s":["security","disable_security"],"r":[],"l":100,"c":"Slicer"},"jam":{"d":"Level 100 Slicer Skill\n\nThis skill uses the slicer's ability to tamper with the navigational\ncomputers of the victim ship via the communication systems. The slicer uses\nhis datapad to transmit a series of corrupt nav readings, jamming the target's\nship and preventing the use of radar, targeting, tractor beams and\ncommunications such as talk or clan, but not intercom, hail or system\nbroadcast.\n\nA jam attempt is a straight comparison between the target and the slicer's ship\ncomm stats. If the slicer has more of a comm stat than the target, the target\nwill be jammed for a period of time proportional to the gap between the two\ncomm stats. If the slicer's ship does not have a higher comm stat, they will\nfail to jam the target's ship.\n\nA slicer can overload their ship's comm system to get an edge, effectively\nincreasing the stat by a factor of 11. There is a drawback to this, in that\nit will destroy the slicer's own comm systems on their own ship. A ship with\na destroyed comm system will be treated as if it is jammed itself, however the\ncomm system can be repaired with a transceiver item and the repairship skill.\n\nA slicer can also break free of a tractor beam capture attempt by jamming the\nship's navigational computers.","s":["Jam <Target ship>","Jam <Target ship> Overload"],"r":[],"l":100,"c":"Slicer"},"lifthack":{"d":"Allows a player to override a turbolift's security systems (new lifts only). If\nyou are on a turbolift landing, you do not need to provide an argument. If you\nare in a lift, the argument is the level number or name that you want to go to.\nRequires a datapad.\nThough it is a level 100 skill, some lifts have more advanced security systems\nand require a higher slicer level.\nsave","s":["lifthack <argument>"],"r":[],"l":100,"c":"Slicer"},"security":{"d":"Level 100 Slicer Skills\n\nA trained slicer can enable security in a room, creating an alarm system that\nwill notify the planet's governing organization of shady activity.\n\nDisable_security is used to disable the alarms, allowing a thief to work\nin relative peace.\n\nSlicers over level 140 will notice a [Security] tag in rooms that have been\nsecured.\n\nSkills that will trip an alarm - hack, short, lifthack, tapdata, breach,\ndoorcut, disable_security, doorbash, slice, pirateship, trafficking, explosions","s":["security","disable_security"],"r":[],"l":100,"c":"Slicer"},"decrypt_file":{"d":"People can use slicing skills to damage their record that appears\nusing the lookup skill. Encrypt_file is used to make it unreadable, and\ndecrypt_file is used to repair it.\n\nThe history display command notes whether your personal file is currently\nencrypted or unencrypted.","s":["encrypt_file <target> OR decrypt_file <target>"],"r":[],"l":105,"c":"Slicer"},"crackdatapad":{"d":"Level 110 Slicer Skill\n\nA locked datapad is no match for a trained slicer! While holding a locked\ndatapad, use the 'crackdatapad' skill to override its security. This will\nremove the security lock on the datapad and allow you to read its contents.","s":["crackdatapad"],"r":[],"l":110,"c":"Slicer"},"protect_account":{"d":"Level 120 Slicer Skill\n\nThe slicer, using his knowledge of computer systems, is able to protect an\naccount from hackers. The protection is strong, jamming the hacker's system,\nand causing a strong electric surge. This can permanently kill the hacker\nif they are attempting it from a non-safe room or area.","s":["protect_account #account"],"r":[],"l":120,"c":"Slicer"},"matchvector":{"d":"Level 135 Slicer Skill\n\nWhen used in space, by a slicer with a datapad, this skill will let them\nattempt to hack the enemy ship's nav comp and make their own ship match\nthe enemy ship's hyperjump vector.","s":["matchvector <ship>"],"r":[],"l":135,"c":"Slicer"},"tapdata":{"d":"Level 140 Slicer Skill\n\nTapdata allows a slicer to monitor certain computer networks and\nview the traffic crossing over them. If the slicer taps into a comm network\njunction, they will be able to see all of the CommNet traffic that is\noriginating from the planet they are on.\n\nIf the slicer taps into a banking network junction, they will be able to see\nwithdrawals and deposits from unprotected accounts, complete with the account\nnumbers. Again, only from bank terminals on the planet they are on.\n\nRoom tags will be visible to level 130+ slicers to indicate what rooms can be\ntapped.\n\nSlicers will be able to protect these tap points by enabling room security.\n\nRooms where this skill can be used are indicated by the [Comm Junction]\nflag.","s":["tapdata <comm/bank>"],"r":[],"l":140,"c":"Slicer"},"aid":{"d":"Level 1 Medical Skill\n\nRequired Item(s): A medpac\n\nThis skill allows you to bring a stunned person back into consciousness.\nIn order to use, you must be holding a medpac. It will deduct 1 unit\nfrom the medpac and aid the target.","s":["aid <character>"],"r":[],"l":1,"c":"Medical"},"first aid":{"d":"Level 1 Medical Skill\n\nFirst aid allows you to heal the wounds of yourself or someone else nearby\nwhile holding a medpac. The medpac will be consumed by using this skill. This\nskill is channeled, so as long as you're not interrupted you'll continue\nhealing up to 100%. The quality of the medpac determines how quickly hp is\nrestored.\n\nAdvanced first aid and expert first aid are passive skills which increase the\namount of healing done by 30% each, stacking. (If you have both, you'll restore\nabout 70% more hp per first aid tick compared with someone who doesn't have\neither skill.)","s":["first <victim>"],"r":[],"l":1,"c":"Medical"},"diagnose":{"d":"Level 10 Medical Skill\n\nThis skill allows a player to figure out affects, abilities, cybernetic\ninstallments, and various other stats another player or mobile has through\nthe use of a datapad.\n\nYou must approach the target and be holding a datapad with Medical remodulation\nor higher, in order to use this skill.","s":["Diagnose <target>"],"r":[],"l":10,"c":"Medical"},"makemedpac":{"d":"Level 25 Medical Skill\n\nRequired Item(s): a toolkit, an empty canteen, a piece of durasteel, and some\nsort of fabric for the bandages\n\nThis allows a skilled doctor or field medic to build a medical kit using\nequipment from their local hospital. With the right amount of experience, all a\nmedical practicioner will need are parts and not medical facilities to\nconstruct a medical kit. The more experience in crafting these medical kits,\ncoupled with the practicioner's experience, determine the extent to which the\npatients wounds are treated.","s":["makemedpac <medpac name>"],"r":[],"l":25,"c":"Medical"},"revive":{"d":"Level 30 Medical Skill\n\nSimilar to aid, this skill can be used to restore a stunned player back to\nconsciousness. It has the unique ability of being able to treat paralysis\nthough, such as that caused by Blackjack and Concussion bombs.\n\nIn order to use, you must be holding a medpac. It will deduct 1 unit from\nthe medpac, and revive the target.\n\nIf a being has the sleep condition from being injected with a sedative, revive\nwill purge the sleep from their body, and then a WAKE will rouse them.","s":["Revive (character)"],"r":[],"l":30,"c":"Medical"},"advanced first aid":{"d":"Level 1 Medical Skill\n\nFirst aid allows you to heal the wounds of yourself or someone else nearby\nwhile holding a medpac. The medpac will be consumed by using this skill. This\nskill is channeled, so as long as you're not interrupted you'll continue\nhealing up to 100%. The quality of the medpac determines how quickly hp is\nrestored.\n\nAdvanced first aid and expert first aid are passive skills which increase the\namount of healing done by 30% each, stacking. (If you have both, you'll restore\nabout 70% more hp per first aid tick compared with someone who doesn't have\neither skill.)","s":["first <victim>"],"r":[],"l":50,"c":"Medical"},"inject":{"d":"Level 55 Medical Skill\n\nThis skill allows a player to inject a target with the contents of a held\nsyringe. INJECT is essential for injecting sedatives before cybernetic surgery,\nand it is also useful for sedating victims for capture or for curing poison\n(depending on the contents of the syringe).","s":["Inject <target>"],"r":[],"l":55,"c":"Medical"},"healwound":{"d":"Level 75 Medical Skill\n\nThis medical skill requires a medpac, and will attempt to heal a wound\nsustained by the target. To see what wounds they have, use the DIAGNOSE skill\nor ask them to check the WOUNDS command. Wounds are generally the result of\ncombat and, if untreated, can cause someone to bleed to death.\n\nFor more information check the help file on WOUNDS.","s":["healwound <target> <wound location>"],"r":[],"l":75,"c":"Medical"},"cyber":{"d":"Level 100 Medical Skill\n\nRequired items: sedative syringe, vibroblade, cybernetic implant, medpac,\ntoolkit\n\nA doctor can use this skill to install cybernetic parts into their patient.\nThere are a few things to remember concerning cybernetics, the first of which\nbeing that the patient MUST be sedated in order to be operated upon. Next, the\ncybernetic must be held along with a cutting tool, like a vibroblade.\n\nMost importantly, the patient cannot wake before the process is completed. If\nthe surgeon fails to complete the surgery either by the patient waking up or\nthe surgeon being interrupted, the patient can be hospitalized or worse\ndepending on the circumstances. To make sure that an operating room is safe,\nyou can check SCORE for the Safe(X) flag.\n\nCybernetics are located in stores throughout the galaxy, but the ones available\nby default aren't nearly as effective as those created by the DEVELOP process\nby clans focused on medical services.\n\nOnce a cybernetic is installed, it can only be replaced by a doctor with the\nCYBERNETIC EXPERT feat. A single character can have a maximum of SIX cybers\ninstalled at any one time.","s":["cyber <target>"],"r":[],"l":100,"c":"Medical"},"expert first aid":{"d":"CommNet 0 [A being in dragon armor]( gruffly ): Mossy stays drunk so much, that will be\n normal for him\n AID'\nLevel 1 Medical Skill\n\nFirst aid allows you to heal the wounds of yourself or someone else nearby\nwhile holding a medpac. The medpac will be consumed by using this skill. This\nskill is channeled, so as long as you're not interrupted you'll continue\nhealing up to 100%. The quality of the medpac determines how quickly hp is\nrestored.\n\nAdvanced first aid and expert first aid are passive skills which increase the\namount of healing done by 30% each, stacking. (If you have both, you'll restore\nabout 70% more hp per first aid tick compared with someone who doesn't have\neither skill.)","s":["first <victim>"],"r":[],"l":125,"c":"Medical"},"ponder":{"d":"Level 1 Science Skill\n\nThis skill is the first stage of SCIENCE. Young scientists use this until\nthey hit level 30 to level up in science. Be warned, it will not be\neasy to walk the path of the scientist. Those wishing instant gratification\nwill be disappointed.","s":["ponder"],"r":[],"l":1,"c":"Science"},"advanced electronics":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of advanced electronics will increase a slicer's\nproficiency in slicing and securing, as well as the quality of an engineer's\ncircuits.","s":["passive"],"r":[],"l":30,"c":"Science"},"chemistry":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of chemistry will produce better results when an\nengineer enhances armor with the Krayt Dragon Hide underlay.","s":["passive"],"r":[],"l":30,"c":"Science"},"construction":{"d":"Level 30 Science Knowledge Skill\n\nThose with knowledge of construction are able to glean special characteristics\nabout fabric, rare metals, duraplast and durasteel when they examine them.\nAdvanced knowledge is required for a scientist to Hypothesize engineering\ntopics. Rudimentary knowledge of this science will allow you to discern the\nproperties of fabric, duraplast, and durasteel.","s":["passive"],"r":[],"l":30,"c":"Science"},"data":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of data will increase a slicer's proficiency in\nslicing and securing security protocols, and is required for a scientist to\nhypothesize espionage and slicing topics.","s":["passive"],"r":[],"l":30,"c":"Science"},"destruction":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of destruction will produce better results when an\nengineer makes weapons and enhances armor with the Zabrak Combat Mesh underlay.\nSmugglers are able to strip starships more efficiently at a black market with\nthis knowledge, and destruction is also required for a scientist to hypothesize\ncombat topics. Rudimentary knowledge of this science will allow you to discern\nthe properties of weapons.\n\nMAKEGRENADE, HELP MAKELANDMINE, HELP MAKEBOWCASTER, HELP ENHANCEARMOR, HELP\nSTRIPSHIP, HELP HYPOTHESIZE, HELP EXAMINE","s":["passive"],"r":[],"l":30,"c":"Science"},"edibles":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of edibles might provide some benefits when making\nfood or drink.","s":["passive"],"r":[],"l":30,"c":"Science"},"education":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of education will improve a scientist's\nhypothesis, producing better datachips that are more instructive for their\nreaders.","s":["passive"],"r":[],"l":30,"c":"Science"},"electronics":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of electronics will increase a slicer's\nproficiency in slicing and securing security protocols, produces better results\nwhen an engineer makes circuits, and required for a scientist to hypothesize\nespionage topics. Rudimentary knowledge of this science will allow you to\ndiscern the properties of shields.","s":["passive"],"r":[],"l":30,"c":"Science"},"enhancement":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of enhancement will produce better results when an\nengineer enhances armor with the Verpine Fiber Mesh underlay and coatings.","s":["passive"],"r":[],"l":30,"c":"Science"},"equipment":{"d":"General Command\n\nEQUIPMENT lists your equipment (armor, weapons, and held items).\nINVENTORY lists your inventory.\n\nIf you are looking for the Equipment skill:\n\nLevel 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of equipment will produce better results when an\nengineer makes weapons and armor. With their advanced knowledge of equipment,\nthey will craft armor quicker and can make clothing, containers, and medpacs\nwithout a workshop. It is also required for a scientist to hypothesize\nsmuggling, espionage and slicing topics. A rudimentary knowledge of this\nwill allow you to discern the properties of armor.\n\nMAKEBOWCASTER, HELP MAKEARMOR, HELP MAKECLOTHING","s":["equipment","inventory","passive"],"r":[],"l":30,"c":"Science"},"forensics":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of forensics currently provides no benefit to\nexisting skills.","s":["passive"],"r":[],"l":30,"c":"Science"},"guidance":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of guidance is required for a scientist to\nhypothesize bounty hunting topics.","s":["passive"],"r":[],"l":30,"c":"Science"},"machines":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of machines currently provides no benefit to\nexisting skills.","s":["passive"],"r":[],"l":30,"c":"Science"},"medical":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of the medical field will produce better results\nwhen a doctor makes medpacs, and when an engineer enhances armor with the bacta\nunderlay. This knowledge is required for a scientist to hypothesize medical\ntopics.\n\nARMOR_TABLE\n\nFor information on the Medical class: HELP MEDICAL_CLASS","s":["passive"],"r":[],"l":30,"c":"Science"},"minerals":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of minerals will allow the rock enthusiast to\nidentify the practical applications for a crystal, and identify cortosis on\nweapons. Engineers use this knowledge to produces better results when\ngemcutting. Rudimentary knowledge of this science will allow you to discern the\nproperties of crystals and rare metals.","s":["passive"],"r":[],"l":30,"c":"Science"},"narcotics":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of narcotics will produce purer results when a\nsmuggler makes spice. Rudimentary knowledge of this will allow you to discern\nthe properties of drugs.","s":["passive"],"r":[],"l":30,"c":"Science"},"spacecraft":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of spacecraft will enable an engineer to build\nships faster, and to upgrade them with a higher chance of success. Smugglers\nare able to strip starships more efficiently at a black market with this\nknowledge, and it is also required for a scientist to hypothesize smuggling and\npiloting topics.","s":["passive"],"r":[],"l":30,"c":"Science"},"study":{"d":"Level 30 Science Skill\n\nUse of this skill will let a scientist study an object, or a ship, to gain more\nunderstanding of the subject. For example, if you were to study a circuit, you\nwould learn about electronics, and if you studied a chunk of durasteel you'd\nlearn about construction.\n\nNote: The studying of ships is currently bugged and does not work.","s":["study <object/ship>"],"r":[],"l":30,"c":"Science"},"transportation":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of transportation will enable an engineer to\nproduce larger containers. Rudimentary knowledge of this science will allow you\nto discern the properties of containers and holsters.","s":["passive"],"r":[],"l":30,"c":"Science"},"develop":{"d":"CommNet 0 [A being in dragon armor]( gruffly ): Keep tryin Mossy\n\nLevel 150 Science Skill\n\nClans in LOTJ are able to invent new ships, equipment, or other technology over\nthe course of the timeline using our development process.\n\nClan leaders should appoint ONE trusted person to serve as their clan's lead\ndeveloper. All development applications and communications will be made by/go\nthrough that one person. They'll work with staff using the devapp system to\ndiscuss which thing the clan would like to invent. See the guidelines in HELP\nDEVLIST. For best results, come up with a few similar/related options that fit\nwithin the broader idea of your proposed development and we'll let you know\nwhich one(s) are okay. Describe the item or outcome you want and any stat\npriorities. No logs are necessary at this time.\n\nOnce a concept is approved by staff (the application status is visible through\nthe devapp system), and once your clan is eligible to begin development\n(visible on the showclan page), anyone with the develop skill and empowerment\ncan track and contribute to its progress.\n\nDevelopment of a new technology requires one or more breakthroughs. Each one\nwill focus on a specific science. Using develop goal with no other arguments\nwill show you the science you need to work on for each development. Your clan\nwill need to agree internally on what breakthrough you're trying to get in that\nfield, and then must use this command to set it. For example, developing an\nimproved transport, you might look for a breakthrough in the spacecraft field\nof \"miniaturized class 2 hyperdrive\".\n\nOnce someone has set the current breakthrough goal, use develop on the\nappropriate science field to search for a solution. Each use consumes 50,000\ncredits from the clan account. Breakthroughs have a maximum cost set per era,\nbut you might get lucky and hit a breakthrough sooner.\n\nYou'll repeat the above two steps until you've hit all the breakthroughs you\nneed. The number depends on how significant the development is.\n\nBefore, during, or after searching for breakthroughs, you should roleplay about\nthe invention. This is freeform and can involve players who don't have the\ndevelop skill or are outside your clan. One person will need to log the RP. Be\nsure to turn off unnecessary output (prompts, OOC channels, etc) or trim it\nfrom the logs. There is a goal for the amount of RP done. In general, a couple\nhours worth of sessions with a small group should produce enough.\n\nAfter finishing the RP and reaching required breakthroughs, the lead developer\nshould submit logs by email that include (and only include) roleplay-related\ncontent (SAYs, EMOTEs, etc.). Logs with prompts or random LOOKs will be\nrejected. Logs should be sent to develop@legendsofthejedi.com and include the\nfollowing subject line:\n\n[Logs] Development: <DEVELOPMENT NAME> || Clan: <CLAN NAME>\n\nThe development name should precisely match the name used in devapp. For\nexample, your email's subject line might read:\n\n[Logs] Development: Improved Kyber Crystals || Clan: The Jedi Order\n\nAny questions about a development should be directed to the staff by using the\ndevapp message system. Please do not use immchats, emails, or Discord DMs to\nask about the status of your development.","s":["develop","develop goal <breakthrough goal name>","develop <science>"],"r":[],"l":150,"c":"Science"},"hypothesize":{"d":"This will attempt to write a hypothesis on the skill you specify. You\nmust be at adept (100%) in the skill before writing on it. Your skill\npercent in education will determine how much one can learn from the book. Your\nability in science will also dictate the amount one can learn from the book.\nYou must HOLD the book, and it must be blank.\n\nOne may learn from a book, once it has been first hypothesized and then\ntheorized, by using STUDY.\n\n(Note that datachips no longer provide skill % to the reader. They provide\nexperience in the appropriate class.)","s":["hypothesize <skill>"],"r":[],"l":150,"c":"Science"},"theorize":{"d":"Level 150 Science Skill\n\nYou must have a hypothesis on a skill held in hand while using this\nskill for it to be successful. This will, based on your skills as a scientist,\nattempt to finish the hypothesis and finalize the book to be used by others\nto gain general experience in the same class as the datachip's skill.\n(Datachips do not increase skill %.)\n\nOnce finished, one may STUDY the book to learn from it.","s":["theorize"],"r":[],"l":150,"c":"Science"},"duelist":{"d":"Do 20% more damage while wielding pistols (single or dual). You will also get\n35% more hits while performing aimed shots with pistols.\n\nCharacters with the duelist feat can also reload both weapons using the ammo\ncommand without needing to have one hand free.","s":[],"r":[],"l":50,"c":"Combat"},"quick healer":{"d":"While not stunned, you regain health at triple the normal rate. When stunned,\nyou will regain health at five times the normal rate. When incapacitated or\nmortally wounded, you will regain health at a marginal rate. You are also\nstunned for half the duration from blaster stun effects.","s":[],"r":[],"l":50,"c":"Combat"},"deadeye":{"d":"This feat enhances your ability to snipe. It speeds your initial snipe delay\nfrom 6 seconds to 3 and checks again for your target every second instead of\nevery 3 seconds. It also provides a chance to score a critical hit when\nsniping, boosting damage by 50%.","s":[],"r":[],"l":70,"c":"Combat"},"toughness":{"d":"This feat reduces all damage taken by 10%.","s":[],"r":[],"l":110,"c":"Combat"},"iron wall":{"d":"10% chance of taking no damage when hit.","s":[],"r":[],"l":135,"c":"Combat"},"advanced disarm":{"d":"This feat will allow a skilled combatant the chance to disarm an opponent\nwhile unarmed, as opposed to requiring a weapon.","s":[],"r":[],"l":150,"c":"Combat"},"navigator":{"d":"This feats allow you to calculate your jumps more efficiently by increasing the\nship's hyper drive rating by 30%.","s":[],"r":[],"l":100,"c":"Piloting"},"evading":{"d":"Your ability to dodge incoming fire when piloting a ship is increased by 15\npercentage points.","s":[],"r":[],"l":145,"c":"Piloting"},"precision":{"d":"Your ability to hit targets with ship weapons is increased by 15%.","s":[],"r":[],"l":150,"c":"Piloting"},"armor crafting":{"d":"+250 HP bonus when enhancing armor with a bacta underlay. +1 stat point for any\nother underlay enhancement.","s":[],"r":[],"l":100,"c":"Engineering"},"droid making":{"d":"Droids you make get +3 to all stats.","s":[],"r":[],"l":130,"c":"Engineering"},"structure building":{"d":"No help on 'structure building' found. Opening only similar helpfile.\nSTRUCTURE_BUILDING\n\nLevel 130 Engineering Feat\n\nEngineering components are +33% more effective when using buildstructure.","s":[],"r":[],"l":130,"c":"Engineering"},"ship building":{"d":"Reduces time to complete the BUILDSHIP skill by 1/3.\n\nCompounds with other shipbuilding bonuses like being grouped with an\nengineering leader or using an industry droid.","s":[],"r":[],"l":145,"c":"Engineering"},"increasedresistance":{"d":"This will give you an extra 25% chance of not being stunned by blasters.","s":[],"r":[],"l":100,"c":"Bounty hunting"},"endurance":{"d":"This feat temporarily boosts your HP by 400 points.","s":[],"r":[],"l":120,"c":"Bounty hunting"},"sticky fingers":{"d":"This feat nets you 3x as many credits when stealing.","s":[],"r":[],"l":60,"c":"Smuggling"},"slippery":{"d":"+25% chance to escape someone's hold.","s":[],"r":[],"l":80,"c":"Smuggling"},"reflexes":{"d":"This feat gives you +30% chance to dodge.\nIf wearing heavy armor, it will instead give you +15% chance to dodge.\nWhen wielding a lightsaber, it will instead give you +10% chance to dodge.","s":[],"r":[],"l":95,"c":"Smuggling"},"masquerader":{"d":"Doubles the number of disguise slots available to those with the disguise\nskill.","s":["Passive"],"r":[],"l":100,"c":"Smuggling"},"transport specialist":{"d":"This feat allows you to have control over an additional stolen ship.","s":[],"r":[],"l":100,"c":"Smuggling"},"silent sneak":{"d":"This feat removes the \"sneaking around\" action message that you would otherwise\nhave while under the effects of sneak. Additionally, you will be able to use\nthe VISIBLE command to cease sneaking and not give an echo so long as you are\nnot hiding or invisible.","s":[],"r":[],"l":135,"c":"Smuggling"},"salesman":{"d":"This feat nets you 10% more credits when selling items to shops, gets you a\nbetter price for parts sold when stripping ships, and improves your odds of\nsuccess when using the buycontraband and sellcontraband commands.","s":[],"r":[],"l":50,"c":"Leadership"},"communicator":{"d":"This feat allows you to learn two extra languages (cumulative with\nMASTER_COMMUNICATOR).","s":[],"r":[],"l":80,"c":"Leadership"},"valor":{"d":"This feat will raise the mental state of your party.","s":[],"r":[],"l":80,"c":"Leadership"},"refresh":{"d":"This feat allows you to refresh the movement of your party members. Doing this\nputs a REFRESH effect on you, and you cannot do it again until the effect has\nworn off. This is only usable if you are the leader of a group, and if your\ngroup is present.","s":[],"r":[],"l":90,"c":"Leadership"},"rally":{"d":"This feat lets you rally your party members, restoring 20% of their health.\nDoing this puts a RALLY affect on you, and you cannot do it again until the\naffect has worn off. This is only usable if you are the leader of a group, and\nif your group is present.","s":[],"r":[],"l":120,"c":"Leadership"},"morale":{"d":"This feat lets you temporarily boost the morale of your party.\nThose affected gain +10 to their hitroll.","s":[],"r":[],"l":130,"c":"Leadership"},"fortify":{"d":"This feat lets the leader of a party fortify their position. Moving from that\nroom will strip them of the affect, but while it is in play party members will\ntake 20% less damage.","s":[],"r":[],"l":140,"c":"Leadership"},"master communicator":{"d":"This feat allows you to learn three extra languages (cumulative with COMMUNICATOR).","s":[],"r":[],"l":140,"c":"Leadership"},"inspirecrime":{"d":"Level 150 Leadership Feat\n\nAn experienced leader can talk the public into rising up against their current\ngovernment. This skill costs 2,000 credits per use, but when used in a room\nwith a citizen mob, there's a chance they will decide to turn on the\ngovernment, increasing crime from 1-2.5 points. Success is more likely if the\npublic has low opinion of their government.\n\nHigh crime costs the government money over time due to embezzlement, but also\ncauses a fixed penalty to public opinion which will go up and down along with\nthe crime rating. Crime can also make it easier to reduce military presence on\na planet, since military presence no longer goes up on its own if crime is\nhigher.\n\nClans can make incitement illegal. If this is set, inspiring crime will mark\nyou as wanted if a local police mob is in the room when used.","s":["inspirecrime"],"r":[],"l":150,"c":"Leadership"},"camera avoidance":{"d":"This feat allows you to hide your actions from cameras, if any are present.\nThis feat does not hide you from cameras completely, and those monitoring the\nnetwork will be able to see you are in the room. This feat will also not hide\nactions targeted at you.","s":[],"r":[],"l":100,"c":"Espionage"},"minesweeper":{"d":"Level: 150 Espionage Feat\n\nThis feat allows a trained agent to interact with landmines in various ways:\n\nInstead of exploding when you enter the room, mines will explode when you leave\nthe room. On entering a room with an active mine, you'll get this message: You\nhear a soft *click* followed by an unsettling whirring noise.\n\nThat means you've tripped a landmine and it'll blow up as you step out of the\nroom. It'll also go off after 15 minutes even if you don't move. (And before\nyou think about going linkdead to avoid getting hit... it takes longer than 15\nminutes to clear out your character after going linkdead.)\n\nMinesweeper also allows players to see mines (including when scanning) and pick\nthem up. When picked up, they're disarmed. In combination with the above\nchange, this lets minesweepers rescue people who are stuck in a mined ship...\nif they can get there in time.","s":[],"r":[],"l":150,"c":"Espionage"},"disrupt network":{"d":"Syntax - tapdata comm disrupt\n\nThis feat allows a capable slicer to disrupt all commnet, clan chat, broadcast,\nalarm, the call skill, holotransmitters, drone reception and camera frequencies\non a planet through the usage of tapdata.","s":[],"r":[],"l":150,"c":"Slicer"},"ping ship":{"d":"Now when you locateship a ship, it will try to find the sector the ship is in\nso long as it isn't docked or in hyperspace. This distance is an absolute (non\nnegative) number and indicates how far away they are. If you are in 0,0 and\nyou locateship a ship in 3,3 it will say you are 6 sectors away.","s":[],"r":[],"l":150,"c":"Slicer"},"cybernetic expert":{"d":"Allows the doctor to upgrade a patient's existing cybernetic with an improved\ncybernetic. Characters with the Cybernetic Expert trait may also remove existing\ncybernetics using the command:\n\nOnly non-stat cybernetics may be removed. Removed cybernetics are destroyed and\nare not recovered.","s":["cyber <victim> remove <cybernetic name>"],"r":[],"l":140,"c":"Medical"},"scientific mind":{"d":"You get bonus experience in all classes, and master skills twice as fast due to\nyour scientific mind!","s":[],"r":[],"l":50,"c":"Science"},"enduring facade":{"d":"Reduces the chance of damage breaking a disguise by 10 percentage points. Additionally, raises the damage required to check for a broken disguise to 300 damage. Any single hit that deals less than 300 damage will not be able to knock off a disguise.\n\nNOTE: This is 300 damage BEFORE sanctuary and similar effects is applied.","s":["Passive"],"r":[],"l":"130","c":"Smuggling"},"str":{"d":"Strength (STR in your 'score') represents your character's physical power.\n\nThe most common concern with strength deals with how much your character can carry. For each additional point of strength you gain an additional amount of maximum carrying weight. Any character with 20 strength can carry 500kgs; races can have a maximum of 25 strength, and can therefore carry up to 999kgs when their strength is at its maximum.\n\nStrength also affects (among other things):\n\n- damage roll and hitroll; for each additional point of strength, each of these will increase.\n\n- chances of success for bash, doorbash, shove and drag, and the ability to dual-wield heavier weapons.\n\nThe STR stat affects the COMBAT class.\nThis stat can be raised by training in COMBAT.","s":[],"r":[],"l":"","c":"Stat"},"dex":{"d":"Dexterity (DEX in your 'score') represents your character's agility, and it affects (among other things):\n\n- the number of movement regenerated at each tick when resting.\n\n- speed when moving between rooms.\n\n- how likely your opponents are to miss you in combat.\n\nDexterity affects the PILOTING and ESPIONAGE classes.\nThis stat can be raised by training in both PILOTING and ENGINEERING.","s":[],"r":[],"l":"","c":"Stat"},"con":{"d":"Constitution (CON in your 'score') represents your character's physical endurance and stamina. Among other things, it affects:\n\n- the number of hitpoints recovered or regenerated at each tick if resting or sleeping\n\n- Speed when moving between rooms\n\nConstitution affects the COMBAT and BOUNTY HUNTING classes.\nThis stat can be raised by training in both COMBAT and BOUNTY HUNTING.","s":[],"r":[],"l":"","c":"Stat"},"int":{"d":"Intelligence (INT in your 'score') represents your character's mental capacity. Among other things, it affects:\n\n- the rate at which a character learns a new skill or power\n\n- the percentage rate at which a character practices a new language\n\n- the maximum number of languages you have. See also Help int_limit.\n\n- helps with save rolls, mainly forcer based\n\nThe INT stat affects SCIENCE, ENGINEERING and MEDICAL\nTraining in both ESPIONAGE and SCIENCE can sometimes raise this stat.","s":[],"r":["int_limit"],"l":"","c":"Stat"},"wis":{"d":"Wisdom (WIS in your 'score') represents your character's wisdom and ability to incorporate learning. Among other things, it affects:\n\n- the percentage a character learns of a new language at each practice, though intelligence affects this slightly more\n\n- helps with save rolls, mainly forcer based\n\nIn other words, it is expert knowledge about the practical aspects of life acquired as one ages.\n\nThe LEADERSHIP, SLICER, and MEDICAL classes are affected by the WIS stat.\nTraining in MEDICAL, SCIENCE and SLICING can sometimes raise this stat.","s":[],"r":[],"l":"","c":"Stat"},"cha":{"d":"Charisma (CHA in your 'score') represents your characters physical beauty and charm. It primarily affects:\n\n- a character's practice rate with a language scholar\n\n- prices charged to a character by shopkeepers\n\nLEADERSHIP and SMUGGLING are affected by the CHA stat.\nTraining in LEADERSHIP has a chance to raise this stat.","s":[],"r":[],"l":"","c":"Stat"},"adv electronics":{"d":"Level 30 Science Knowledge Skill\n\nAcquiring advanced knowledge of advanced electronics will increase a slicer's\nproficiency in slicing and securing, as well as the quality of an engineer's\ncircuits.","s":["passive"],"r":[],"l":30,"c":"Science"},"class_com":{"d":"Ever dreamed of kicking down doors and dispensing hurt? Laying mine fields in advance of enemy troops? Or maybe blowing up starships with thermal detonators? In case you didn't know, nothing feels better than knocking your enemy's helmet clean off with a brutal sweep of your force pike. The combat class, or combatants, are the primary fighting class of the galaxy. Their business is war and business is always booming. They generally serve as the galaxy's soldiers, guards, or mercenaries. Some of the most well-known fighting groups include Republic Commandos, Clone Troopers, or Imperial Stormtroopers. Combatants utilize and are able to master blasters such as rifles, pistols, and repeaters as well as melee forcepikes. They are also mildly proficient with vibroblades and basic hand-to-hand combat. Fully trained fighters can specialize with offensive or defensive feats that suit their style and help them maintain an edge over their opponents. With a little training, these warriors can fully utilize explosives such as mines and grenades. Other skills at their disposal are the ability to gouge, disarm, bash, and kick opponents into submission. The truly dedicated among the elite fighters go on to master the difficult art of Flurry attacks, becoming a true martial force to be reckoned with.\n\nFamous Combatants\n* FN-2187 \"Finn\", First Order stormtrooper with a conscience turned Rebel.\n* Commander Cody, Clone Commander of the Grand Army of the Republic.\n* Captain Phasma, First Order female Stormtrooper Captain.","s":[],"r":["blasters","kick","gouge","rescue","dodge","hitall","flurry"],"l":"","c":"Class"},"class_pil":{"d":"From single man starfighters to huge flagships with the population of major cities, pilots are the navigators of the space frontier. Anyone can be a pilot to some personal degree, but dedicated pilots excel far beyond the normal in space techniques. Able to specialize in squadrons, large ships such as frigates and cruisers, and then the heavy battleships, true pilots also have more advanced weapons capabilities and defensive abilities to help them come out on top in space combat. A truly dedicated pilot is master of their domain, as no amount of forcepike, blaster, or lightsaber training can help you in space.\n\nBecause large and heavy spacecraft can only be owned by clans, not by individuals, a pilot's choice of clan and trust with clan leaders determines their access to these ships.\n\nFamous Pilots\n* Gial Ackbar, Admiral of the Rebel Alliance and detector of traps.\n* Poe Dameron, ace snubfighter pilot of the Resistance.\n* Wedge Antilles, leader of Rogue Squadron and survivor of both Death Star runs.","s":[],"r":["small spacecraft","weapon systems"],"l":"","c":"Class"},"class_eng":{"d":"For high-quality armor, ships, and weapons, the denizens of the galaxy look to the engineers. The best equipment is usually found in shops designed by players and clans, or even custom-ordered from the galaxy's greatest artisans. To master their art, engineers seek out components scattered on planets across the galaxy, each one different than the next. By exploring and experimenting, they discover which items yield the best results. Engineering has a slower pace than many other classes, but its rewards are well worth it. The best engineers are also highly skilled in science, using their training in various sciences to enhance their work.\n\nMost characters have enough ability in engineering to design their own clothing, comlink, or datapad. But if you want to build a droid sidekick, design high-quality armor, or join your clan's shipbuilding team, choose engineering as your main class.\n\nFamous Engineers\n* Bao-Dur, Zabrak Jedi and engineer, inventor of the Mass Shadow Generator.\n* Walex Blissex, engineer and creator of the Victory Star Destroyer.\n* Shug Ninx, legendary mechanic and owner of the Spacebarn.","s":[],"r":["makeclothing","makeblaster","makedroid","buildship"],"l":"","c":"Class"},"class_hun":{"d":"Ever break into a ship and steal it? Maybe got caught stealing credits from someone? Or perhaps you assassinated a high-level target from the enemy clan. Just because you got away, doesn't mean you're free and clean. If there is a price on your head, chances are you will meet a Bounty Hunter soon. Bounty Hunters are the elite contract mercenaries of the galaxy. They possess powerful and deadly close quarters combat skills to kill or subdue their targets. They are masters of unarmed combat as well as vibroblades, and capable of being adept with more if they are a race with a high combat subclass. They also possess skills that help them locate their prey, see through disguises, as well as extra armor penetration and enhanced survivability.\n\nBounty Hunters are lone wolves who at best maybe work together with a few other bounty hunters to bring down a powerful target. As such, Bounty Hunters CANNOT JOIN CLANS. While Bounty Hunter is a powerful class it is not recommended for new players.\n\nBounty Hunters and Force\nFor balance purposes, Bounty Hunting mains cannot be force sensitive. If you purchase force for your character, do not attempt to mainchange to this class.\n\nFamous Bounty Hunters\n* Boba Fett, notorious Mandalorian bounty hunter and Sarlaac snack.\n* Bossk, Trandoshan bounty hunter and member of the Bounty Hunters' Guild.\n* IG-88, rogue IG-series assassin droid turned bounty hunter.","s":[],"r":["doorbash","track","limber","backstab","circle","ambush"],"l":"","c":"Class"},"class_smu":{"d":"Smugglers are rogues, thieves, and scoundrels who live outside the law or fight against it in order to get the upper hand. Many Smugglers live a life of adventure for the excitement it provides. Others prefer to advance their illicit careers. Some are good-hearted rogues in it for the thrill or to right a wrong done to them or those they love. Others are despicable knaves who serve only one master: the greed that swells inside them. More often, a Smuggler falls somewhere in the middle, changing allegiances and attitudes as the political climate changes.\n\nWith a knack for getting into and out of trouble, they have an instinct for self-preservation that keeps them alive. Smugglers often do not start out seeking to defy authority and break the law. Some are thrust into the profession as a means of rebellion. Others wind up on the wrong side of the law due to bad luck, a poor decision, or circumstances beyond their control.\n\nFamous Smugglers\n* Han Solo, half-witted, scruffy-looking, nerf-herder and Captain of the Millenium Falcon.\n* Lando Calrissian, smuggler, gambler, and Administrator of Cloud City.\n* Talon Karrde, notoriously difficult-to-track smuggler and underground information broker.","s":[],"r":["slip","hide","peek","steal","disguise","pirateship"],"l":"","c":"Class"},"class_lea":{"d":"Every group needs a leader. Legends of the Jedi has an entire Leadership class dedicated to the art of using charismatic nature to inspire others to greatness. Most beings can use their small amount of leadership abilities to teach others, jail criminals, and call in reinforcements. However, only specialized leaders are the best teachers. Beings that are primarily leaders gain experience twice as fast, and those that are in their group do so at 1.5 times their normal rate.\n\nSpecialized leaders are also able to select another class in which they are naturally talented. During character selection, a leader selects a subclass which gives specific bonuses to the player and their group, as well as gaining an additional 30 levels in that subclass.\n\nLeadership Subclasses\nCombat: Group tactics enable your team to cause 10% more damage.\nPiloting: Firing weapons consumes 15% less fuel.\nEngineering: Coordinated construction teams reduce build time by 1/3 and parts add 25% more progress.\nSmuggling: Your group is untrackable.\nEspionage: Spies work faster together; a spy leader can detect slip attempts for their group.\nSlicer: Your group will work 25% faster.\nMedical: Doctors work faster and heal beings quicker.\nScience: Students learn faster when examining objects.\n\nFamous Leaders\n* Sheev Palpatine, AKA Darth Sidious, the Emperor of the Galactic Empire.\n* Wilhuff Tarkin, Grand Moff of the Outer Rim and destroyer of Alderaan.\n* Princess Leia Organa, Senator, General of the Rebel Alliance, and Chief of Staff of the New Republic.","s":[],"r":["call","teach","refresh","rally","morale","fortify","broadcast","propaganda","inspirecrime"],"l":"","c":"Class"},"class_esp":{"d":"The Espionage class is the infiltration and saboteur experts of the galaxy. Also called spies, they are the best at gathering information from other clans, as well as protecting their own clan from prying eyes. Spies have the ability to create, plant, and monitor cameras, as well as defensively search for and remove errant cameras. Adept spies also have a sharp eye that will reveal hidden items at times.\n\nIn addition to information gathering, Espionage agents are adept at tailing subjects, creating binders and wielding a blackjack to subdue enemies, and creating fusion cutters to cut down doors. Spies frequently choose a race that compliments their subclass skills such as Smuggling or Slicer.\n\nFamous Spies\n* Cassian Andor, Rebel agent who assisted in stealing the Death Star plans.\n* Garindan, Kubaz informant who notified the Empire of events at Docking Bay 94.\n* Gara Petothel, turncoat Imperial Intelligence agent inserted into the New Republic's Wraith Squadron.","s":[],"r":["tail","makebinders","sabotage","doorcut","monitor_camera","blackjack"],"l":"","c":"Class"},"class_sli":{"d":"Slicers are the hackers of the Star Wars universe, and often pair well with smuggling or espionage. Elite slicers bend electronics to their will. Send false landing codes to enemy capital ships. Assist bounty hunters in tracking their prey by slicing shipyard databases. Secure lifts during an assault on your base, or hack a lift to open your enemy clan to weakness. Hack unsecured bank accounts or secure others for a fee. Jam and disrupt enemy communications, secure your clan's electronic infrastructure, or eavesdrop on communication traffic.\n\nSlicing in the Legends of the Jedi galaxy is easy to get into, but a long road to master. Being found out while sending false landing codes to an Imperial Star Destroyer can get you slagged, and trying to hack a bank account secured by a peer can leave you dead and charred.\n\nFamous Slicers\n* R2-D2, astromech droid and slicer companion of every major character.\n* Lobot, Lando Calrissian's cyborg aide and computer officer of Cloud City.\n* Mako, slicer companion of the SWTOR Bounty Hunter class.","s":[],"r":["slice","lookup","locateship","fakesignal","encrypt_file","lifthack","matchvector","tapdata"],"l":"","c":"Class"},"class_med":{"d":"The Medical class is chosen by the galaxy's doctors, field medics, and healers. Medical professionals are able to diagnose ailments, craft medpacs, revive fallen allies, and perform advanced surgical procedures. The best doctors work closely with scientists to enhance their craft, using scientific knowledge to produce superior medpacs and more effective treatments.\n\nWhether patching up soldiers on the front lines or running a clinic in a bustling spaceport, medical professionals are indispensable to any team. Master medics can install cybernetic enhancements and perform expert-level first aid that can bring allies back from the brink of death.\n\nClass Skills\nThe Medical class is the backbone of any serious group. Medics learn aid and first aid early, then build toward advanced diagnosis, medpac crafting, wound healing, and eventually cybernetic installation. Working closely with Scientists gives doctors an edge in producing higher-quality equipment and treatments.","s":[],"r":["aid","first aid","diagnose","makemedpac","revive","healwound","cyber"],"l":"","c":"Class"},"class_sci":{"d":"The slowest path of all, science ultimately alters the course of galactic civilizations. By pondering the universe, and then by studying particular fields, a scientist can gain an advantage on many different tasks, such as engineering. A master scientist can eventually write datachips to help others learn any skill that they have already mastered. But the true culmination of science is development: the ability of a clan to introduce new technologies into the game. It is by the work of their scientists that a government or engineering firm unveils new spacecraft, cybernetics, and crafting materials.\n\nMany scientists choose engineering as their main class, relying on their race's natural affinity for the sciences to see them through. Others choose leadership as their main class and science as their subclass, resulting in immense potential for teaching others the sciences.\n\nScientific Knowledge Skills\nMany of the scientist's skills are based around areas of knowledge gained by studying items related to that area. As your overall knowledge improves, so does your proficiency in related skills. Achieving mastery of different areas of scientific knowledge is crucial for technical and scientific classes.\n\nFamous Scientists\n* Galen Erso, crystallographer and unwilling developer of the Death Star.\n* Nuvo Vindi, mentally unstable designer of the Blue Shadow Virus.\n* Qwi Xux, Imperial weapons designer of the Death Star and Sun Crusher.","s":[],"r":["ponder","study","hypothesize","develop"],"l":"","c":"Class"}};

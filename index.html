const SCIENCES = ["adv electronics", "chemistry", "construction", "data", "destruction", "education", "electronics", "enhancement", "forensics", "guidance", "machines", "medical", "minerals", "narcotics", "spacecraft", "study", "transportation", "edibles"];

function openSciModal(){
  const list = document.getElementById('sci-list');
  list.innerHTML = SCIENCES.map(s => {
    const h = lookupHelp(s);
    const desc = h ? h.d.split('\\n')[0].replace(/^Level \\d+ Science Knowledge Skill\\s*/,'').substring(0,60) : '';
    return `<div onclick="closeSciModal();showHelp('${s}')" style="background:#111;border:1px solid #333;border-radius:5px;padding:8px 10px;cursor:pointer;font-size:12px"
      onmouseenter="this.style.borderColor='#555'" onmouseleave="this.style.borderColor='#333'">
      <div style="color:#ddd;font-weight:500;text-transform:capitalize">${s}</div>
      <div style="color:#555;font-size:10px;margin-top:2px">${desc}</div>
    </div>`;
  }).join('');
  document.getElementById('sci-overlay').style.display='flex';
}

function closeSciModal(){
  document.getElementById('sci-overlay').style.display='none';
}
rSel.selectedIndex=0;

// Stat modifier sliders
const STAT_NAMES = ['str','dex','con','int','wis','cha','lck'];
const STAT_LABELS = {str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA',lck:'LCK'};
const statMods = {str:0,dex:0,con:0,int:0,wis:0,cha:0,lck:0};

// Class bonus per stat point (from MUD stat chart)
// 1 raising stat -> +2/point, 2 raising stats -> +1/point each
const CLASS_STAT_BONUS = {
  com:{str:1,con:1},
  pil:{dex:2},
  eng:{int:2},
  hun:{con:2},
  smu:{lck:1,cha:1},
  lea:{cha:1,wis:1},
  esp:{dex:1,lck:1},
  sli:{wis:1,lck:1},
  med:{int:1,wis:1},
  sci:{int:2}
};

function buildSliders(){
  const container = document.getElementById('statSliders');
  container.innerHTML = STAT_NAMES.map(s=>{
    return `<div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;font-weight:600;color:#888;width:28px;cursor:pointer;text-decoration:underline dotted" onclick="showHelp('${s}')">${STAT_LABELS[s]}</span>
      <input type="range" min="${s==='lck'?-10:-5}" max="${s==='lck'?10:5}" value="0" step="1"
        style="flex:1;accent-color:#378ADD;cursor:pointer"
        oninput="statMods['${s}']=parseInt(this.value);document.getElementById('statVal_${s}').textContent=(this.value>0?'+':'')+this.value;render()"
      />
      <span id="statVal_${s}" style="font-size:11px;color:#ddd;width:24px;text-align:right">+0</span>
    </div>`;
  }).join('');
}
buildSliders();

function lookupHelp(name){
  const key=name.toLowerCase();
  return H[key]||H[key.replace(/ /g,'_')]||H[key.replace(/_/g,' ')]||null;
}

function showHelp(name){
  const h=lookupHelp(name);
  if(!h)return;
  const CLASS_NAMES={'class_com':'Combat','class_pil':'Piloting','class_eng':'Engineering','class_hun':'Bounty Hunting','class_smu':'Smuggling','class_lea':'Leadership','class_esp':'Espionage','class_sli':'Slicing','class_med':'Medical','class_sci':'Science'};
  document.getElementById('modal-title').textContent=CLASS_NAMES[name]||name.toUpperCase();
  document.getElementById('modal-meta').textContent=(h.c?h.c+' · ':'')+(h.l?'Level '+h.l:'');
  
  const synEl=document.getElementById('modal-syntax');
  if(h.s&&h.s.length){
    synEl.innerHTML=h.s.map(sv=>`<div><span class="syn-label">Syntax:</span>${escHtml(sv)}</div>`).join('');
    synEl.style.display='block';
  } else {
    synEl.style.display='none';
  }
  
  document.getElementById('modal-desc').textContent=h.d||'No description available.';
  
  const saEl=document.getElementById('modal-seealso');
  if(h.r&&h.r.length){
    saEl.style.display='block';
    saEl.innerHTML='See also: '+h.r.map(x=>`<span onclick="showHelp('${x.toLowerCase()}')">${x}</span>`).join('');
  } else {
    saEl.style.display='none';
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay')){
    document.getElementById('modal-overlay').classList.remove('open');
  }
}
document.getElementById('modal-close').addEventListener('click',()=>document.getElementById('modal-overlay').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal-overlay').classList.remove('open');});

function skillRow(u,unlocked){
  if(u.s==='all sciences open'){
    const color=unlocked?'#bbb':'#444';
    const icon=unlocked?'\u2713':'\u25cb';
    const hoverColor=unlocked?'#fff':'#666';
    return `<span style="display:block;color:${color};cursor:pointer;text-decoration:underline dotted;"
      onmouseenter="this.style.color='${hoverColor}'" onmouseleave="this.style.color='${color}'"
      onclick="openSciModal()">${icon} all 18 sciences (30)</span>`;
  }
  const h=lookupHelp(u.s);
  const color=unlocked?'#bbb':'#444';
  const icon=unlocked?'✓':'○';
  if(h){
    const hoverColor=unlocked?'#fff':'#666';
    return `<span style="display:block;color:${color};cursor:pointer;text-decoration:underline dotted;" `+
      `onmouseenter="this.style.color='${hoverColor}'" onmouseleave="this.style.color='${color}'" `+
      `onclick="showHelp('${u.s.replace(/'/g,"\\'")}')"> ${icon} ${u.s} (${u.l})</span>`;
  }
  return `<span style="display:block;color:${color};">${icon} ${u.s} (${u.l})</span>`;
}

function switchTab(id){
  document.getElementById('skillsPanel').style.display=id==='skills'?'block':'none';
  document.getElementById('featsPanel').style.display=id==='feats'?'block':'none';
  document.getElementById('tabSkills').style.cssText='padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid '+(id==='skills'?'#555;background:#2a2a2a;color:#ddd':'#333;background:#1a1a1a;color:#888');
  document.getElementById('tabFeats').style.cssText='padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid '+(id==='feats'?'#555;background:#2a2a2a;color:#ddd':'#333;background:#1a1a1a;color:#888');
}

function render(){
  const rn=rSel.value,mn=mSel.value,fc=fSel.value;
  const race=R[rn];if(!race)return;
  const base=race.levels[mn]||{};
  const bonus=FB[fc]||{};
  const lSel=document.getElementById('lSel');
  // Show leadership subclass dropdown only when LEA is main
  lSel.style.display=mn==='lea'?'':'none';
  const leaSub=mn==='lea'?lSel.value:'none';
  const fin={};
  SK.forEach(k=>{
    const baseVal=(base[k]||0)+(bonus[k]||0);
    // Apply stat modifier bonuses from CLASS_STAT_BONUS table
    const statBonus=Object.entries(CLASS_STAT_BONUS[k]||{}).reduce((acc,[stat,mult])=>acc+(statMods[stat]||0)*mult,0);
    // Leadership subclass: +30 to chosen subclass (still capped at 150)
    const leaBonus=(leaSub!=='none'&&leaSub===k)?30:0;
    fin[k]=Math.min(150,baseVal+statBonus+leaBonus);
  });
  const total=SK.reduce((a,k)=>a+fin[k],0);
  const stats=['str','dex','con','int','wis','cha'];
  const statHtml=stats.map(s=>{const v=race[s];if(!v)return'';const c=v>0?'#1D9E75':'#E24B4A';return`<span style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid ${c};color:${c};cursor:pointer;text-decoration:underline dotted;" onmouseenter="this.style.opacity='0.7'" onmouseleave="this.style.opacity='1'" onclick="showHelp('${s}')">${s.toUpperCase()} ${v>0?'+':''} ${v}</span>`;}).join('');
  document.getElementById('sBar').innerHTML=
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:80px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Total levels</div><div style="font-size:20px;font-weight:500">${total}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:70px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">HP</div><div style="font-size:20px;font-weight:500">${race.hp}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:80px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">AC bonus</div><div style="font-size:20px;font-weight:500">${race.ac}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:70px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">FP/level</div><div style="font-size:20px;font-weight:500">${FP[fc]}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:120px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Force ability</div><div style="font-size:13px;padding-top:4px">${FA[fc]}</div></div>`+
    `<div style="background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:8px 12px;min-width:100px"><div style="font-size:10px;color:#888;text-transform:uppercase;margin-bottom:2px">Cost</div><div style="font-size:13px;padding-top:4px">${race.price}pt / ${race.deposit}dep</div></div>`;
  document.getElementById('bBadges').innerHTML=statHtml||'<span style="font-size:11px;color:#666">all stats baseline</span>';
  document.getElementById('skGrid').innerHTML=SK.map(sk=>{
    const val=fin[sk],isMain=sk===mn,isBoosted=!!(bonus[sk]);
    const border=isMain?'#1D9E75':isBoosted?'#378ADD':'#2a2a2a';
    const label=`<span style="cursor:pointer;text-decoration:underline dotted;" onmouseenter="this.style.color='#ddd'" onmouseleave="this.style.color='#888'" onclick="showHelp('class_${sk}')">${SN[sk]}</span>`+(isMain?' ★':isBoosted?' ↑':'');
    const hits=(KS[sk]||[]).filter(x=>val>=x.l);
    const miss=(KS[sk]||[]).filter(x=>val<x.l).slice(0,3);
    return `<div style="background:#1a1a1a;border:1px solid ${border};border-radius:6px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
        <span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888">${label}</span>
        <span style="font-size:20px;font-weight:500">${val}</span>
      </div>
      <div style="height:3px;background:#2a2a2a;border-radius:2px;margin:3px 0 6px">
        <div style="height:3px;width:${Math.round(val/150*100)}%;background:${SC[sk]};border-radius:2px"></div>
      </div>
      <div style="font-size:11px;line-height:1.8">
        ${hits.map(u=>skillRow(u,true)).join('')}
        ${miss.map(u=>skillRow(u,false)).join('')}
      </div></div>`;
  }).join('');
  document.getElementById('ftGrid').innerHTML=SK.filter(sk=>(KF[sk]||[]).length).map(sk=>{
    const val=fin[sk],isMain=sk===mn,isBoosted=!!(bonus[sk]);
    const border=isMain?'#1D9E75':isBoosted?'#378ADD':'#2a2a2a';
    const feats=KF[sk]||[];
    const hits=feats.filter(x=>val>=x.l);
    const miss=feats.filter(x=>val<x.l);
    return `<div style="background:#1a1a1a;border:1px solid ${border};border-radius:6px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
        <span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888;cursor:pointer;text-decoration:underline dotted;" onmouseenter="this.style.color='#ddd'" onmouseleave="this.style.color='#888'" onclick="showHelp('class_${sk}')">${SN[sk]}</span>
        <span style="font-size:20px;font-weight:500">${val}</span>
      </div>
      <div style="height:3px;background:#2a2a2a;border-radius:2px;margin:3px 0 6px">
        <div style="height:3px;width:${Math.round(val/150*100)}%;background:${SC[sk]};border-radius:2px"></div>
      </div>
      <div style="font-size:11px;line-height:1.8">
        ${hits.map(u=>skillRow(u,true)).join('')}
        ${miss.map(u=>skillRow(u,false)).join('')}
      </div></div>`;
  }).join('');
}
rSel.addEventListener('change',render);
mSel.addEventListener('change',render);
fSel.addEventListener('change',render);
document.getElementById('lSel').addEventListener('change',render);
render();
</script>

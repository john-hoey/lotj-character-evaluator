<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LOTJ Character Evaluator by Bagz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#ddd;font-family:sans-serif;font-size:13px}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:20px 24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;position:relative}
#modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:18px;cursor:pointer;line-height:1}
#modal-close:hover{color:#ddd}
#modal h2{font-size:15px;font-weight:600;color:#ddd;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
#modal-meta{font-size:11px;color:#666;margin-bottom:12px}
#modal-syntax{background:#111;border:1px solid #333;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-family:monospace;font-size:12px;color:#EF9F27;line-height:1.7}
#modal-syntax .syn-label{color:#555;margin-right:6px}
#modal-desc{font-size:12px;color:#bbb;line-height:1.8;white-space:pre-wrap}
#modal-seealso{margin-top:14px;font-size:11px;color:#555;border-top:1px solid #2a2a2a;padding-top:10px}
#modal-seealso span{color:#378ADD;cursor:pointer;margin-right:8px}
#modal-seealso span:hover{text-decoration:underline}
</style>
</head>

<div id="app" style="background:#111;min-height:100vh;padding:12px">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">

    <option value="esp">Espionage (+30)</option>
    <option value="sli">Slicing (+30)</option>

</div>
<div id="sBar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>
<div id="bBadges" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px"></div>

<details id="statModPanel" style="margin-bottom:10px;background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:10px 14px">

<div style="display:flex;gap:4px;margin-bottom:10px">

const H={"throw":{"d":"Level 1 Combat Skill\n\nA useful skill that allows you to throw what you're holding into a connecting\nroom, at a nearby person, at the ground, or out of a ship's hatchway.","s":["throw <item> <direction>","throw <item> <direction> <target>","throw <item> hatch","throw <item> into <ship name>"],"r":[],"l":1,"c":"Combat"},"blasters":{"d":"Level 1 Combat Skill: Blasters\nLevel 45 Combat Skill: Advanced Blasters\nLevel 105 Combat Skill: Blaster Mastery\n\nBlasters are ranged weapons that fire laser bolts. They are common throughout\nthe galaxy, ranging from palm-concealed sporting blasters to the planet\ndestroying Death Star cannon. Each of these skills increase proficiency with\nthe blaster. Blasters covers basic marksmanship. Advanced Blasters includes\nmore complicated tactical combat situations. Blaster Mastery involves\nrigorous, long-term combat training. Elite troops like the clone ARC Troopers\nare usually the only practitioners of Blaster Mastery. Blasters are most\ncommonly created by engineers using the makeblaster command.","s":["Use of the skill is automatic once learned."],"r":[],"l":1,"c":"Combat"},"vibro-blades":{"d":"Level 1 Combat Skill: Vibro-blades\nLevel 40 Combat Skill: Advanced Vibroblades\nLevel 100 Bounty Hunting Skill: Vibroblade Mastery\n\nVibroblades house a sonic generator in the hilt, causing the blade to vibrate.\nThe wounds caused penetrate much deeper than might otherwise be the case.\nThese skills increase proficiency with vibroblades. Vibro-blade covers basic\nattacks, parries and ripostes. Advanced Vibroblades includes the most complex\ncombat maneuvers known to the public. Vibroblade Mastery involves secret\ntechniques only passed from master to apprentice.","s":["Use of the skill is automatic once learned."],"r":[],"l":1,"c":"Combat"},"scan":{"d":"Level 5 Combat Skill\n\nKeen eyed scouts can scan ahead and spot potential danger. This skill\nenables you to scan for one or more rooms in the specified direction.\nYour relative success depends on your skill level, the area type and\nambient light.","s":["scan <direction>"],"r":[],"l":5,"c":"Combat"},"kick":{"d":"Level 7 Combat Skill\n\nBy learning this skill, a combatant studies the flows of combat. You\nunleash a damaging kick when you spot an opening. This kick is in\naddition to any other attacks.","s":["kick (when in combat)"],"r":[],"l":7,"c":"Combat"},"mount":{"d":"Level 7 Combat Skill\n\nThis allows you to mount certain mobs. Being mounted cuts down\non the movement points that you use. Traveling while mounted\nallows a person to traverse water sectors without sustaining\ndrowning damage.","s":["mount <mob>","dismount"],"r":[],"l":7,"c":"Combat"},"grenades":{"d":"Level 10 Combat Skill\n\nGrenades are effective at dealing with large crowds very rapidly. They\nalso come in a variety of different types, including smoke, toxic,\nconcussion, immolation, and many more.\n\nThey can be armed for anywhere between 3 to 500 rounds, and are quite\nversatile. For more information on arming grenades, read HELP ARM.\n\nOnce armed, grenades may be dropped, slipped or thrown. Throw is a good way to\nambush a target with very little warning. Grenades may also be thrown from\na ship's open hatchway by typing THROW (object) HATCH. They may be thrown\nINTO a ship, by using THROW (object) INTO (ship name).","s":[],"r":[],"l":10,"c":"Combat"},"force pikes":{"d":"Level 20 Combat Skill: Force Pikes\nLevel 45 Combat Skill: Advanced Forcepike\nLevel 110 Combat Skill: Forcepike Mastery\n\nThe forcepike is a 2 meter long pike with a vibro-edged head. Due to its size\nand pacification capibilities, the force pike has found greater use in\nmilitias and police forces.\n\nThese skills increase proficiency with force pikes. Force Pikes covers basic\nattacks, parries and ripostes. Advanced Forcepike includes more complex combat\nmaneuvers. Elite commando forces like the Emperor's Royal Guard are usually the\nonly practitioners of Forcepike Mastery.","s":["Use of the skill is automatic once learned."],"r":[],"l":20,"c":"Combat"},"bowcasters":{"d":"Level 25 Combat Skill: Bowcasters\nLevel 50 Combat Skill: Advanced Bowcaster\nLevel 115 Combat Skill: Bowcaster Mastery\n\nA curious combination of modern and ancient technologies, the bowcaster is the\ntraditional weapon of the Wookiee. While seeming anachronistic to those\naccustomed to blasters, a bowcaster is extremely deadly in the hands of a\nskilled Wookiee warrior.\n\nEach of these skills increase proficiency with the Bowcaster. Bowcasters covers\nbasic marksmanship. Advanced Bowcaster includes more complicated tactical\ncombat situations. Bowcaster Mastery involves rigorous combat training. Elite\nShiaWook Fastclaws are usually the only practitioners of Bowcaster Mastery.\n\nAdditional Help Files: AMMO","s":["Use of the skill is automatic once learned."],"r":[],"l":25,"c":"Combat"},"rescue":{"d":"Level 30 Combat Skill\n\nRescue allows a soldier to pull a squad-mate out of combat,\ntaking their place against the opponent.","s":["rescue <character>"],"r":[],"l":30,"c":"Combat"},"snipe":{"d":"Level 35 Combat Skill\n\nExperienced soldiers can accurately shoot at long-range targets.\nThis skill allows you to fire at opponents outside your current area.\n\nWhen you use this skill, there is some delay while you line up your shot. After\nthat, if your target is found in the direction you're aiming, you'll fire.\nOtherwise, the skill will automatically look for them until you cancel or find\nthem.\n\nSniping is most effective with a rifle, but it must have a full ammo clip and\nbe set to full power. You can also snipe with bowcasters and pistols, although\npistols have reduced damage when sniping.","s":["snipe <direction> <target>"],"r":[],"l":35,"c":"Combat"},"advanced vibroblade":{"d":"Level 1 Combat Skill: Vibro-blades\nLevel 40 Combat Skill: Advanced Vibroblades\nLevel 100 Bounty Hunting Skill: Vibroblade Mastery\n\nVibroblades house a sonic generator in the hilt, causing the blade to vibrate.\nThe wounds caused penetrate much deeper than might otherwise be the case.\nThese skills increase proficiency with vibroblades. Vibro-blade covers basic\nattacks, parries and ripostes. Advanced Vibroblades includes the most complex\ncombat maneuvers known to the public. Vibroblade Mastery involves secret\ntechniques only passed from master to apprentice.","s":["Use of the skill is automatic once learned."],"r":[],"l":40,"c":"Combat"},"advanced blaster":{"d":"Level 1 Combat Skill: Blasters\nLevel 45 Combat Skill: Advanced Blasters\nLevel 105 Combat Skill: Blaster Mastery\n\nBlasters are ranged weapons that fire laser bolts. They are common throughout\nthe galaxy, ranging from palm-concealed sporting blasters to the planet\ndestroying Death Star cannon. Each of these skills increase proficiency with\nthe blaster. Blasters covers basic marksmanship. Advanced Blasters includes\nmore complicated tactical combat situations. Blaster Mastery involves\nrigorous, long-term combat training. Elite troops like the clone ARC Troopers\nare usually the only practitioners of Blaster Mastery. Blasters are most\ncommonly created by engineers using the makeblaster command.","s":["Use of the skill is automatic once learned."],"r":[],"l":45,"c":"Combat"},"advanced forcepike":{"d":"Level 20 Combat Skill: Force Pikes\nLevel 45 Combat Skill: Advanced Forcepike\nLevel 110 Combat Skill: Forcepike Mastery\n\nThe forcepike is a 2 meter long pike with a vibro-edged head. Due to its size\nand pacification capibilities, the force pike has found greater use in\nmilitias and police forces.\n\nThese skills increase proficiency with force pikes. Force Pikes covers basic\nattacks, parries and ripostes. Advanced Forcepike includes more complex combat\nmaneuvers. Elite commando forces like the Emperor's Royal Guard are usually the\nonly practitioners of Forcepike Mastery.","s":["Use of the skill is automatic once learned."],"r":[],"l":45,"c":"Combat"},"bash":{"d":"Level 47 Combat Skill\n\nSoldiers look for every edge in combat. Smashing into your opponent slows you\nbut can stun him, possibly buying you valuable seconds. Bash is a combat skill\nthat can be used during combat. It inflicts damage and momentarily stuns both\nyourself and your opponent for approximately two rounds. During\nthat time, you are unable to do anything. You will only inflict damage if your\nopponent is not a player character. There is a drastically reduced chance of\nsuccess if the person performing the 'bash' is not one of the primary targets.","s":["bash"],"r":[],"l":47,"c":"Combat"},"second attack":{"d":"Level 50 Combat Skill\n\nThis skill gives you an extra attack during the combat round. This applies to\nall forms of attack. The chance of making an additional attack, how much damage\nand the chance of hitting are determined by your skill in Second Attack.","s":["Use of the skill is automatic once learned."],"r":[],"l":50,"c":"Combat"},"advanced bowcaster":{"d":"Level 25 Combat Skill: Bowcasters\nLevel 50 Combat Skill: Advanced Bowcaster\nLevel 115 Combat Skill: Bowcaster Mastery\n\nA curious combination of modern and ancient technologies, the bowcaster is the\ntraditional weapon of the Wookiee. While seeming anachronistic to those\naccustomed to blasters, a bowcaster is extremely deadly in the hands of a\nskilled Wookiee warrior.\n\nEach of these skills increase proficiency with the Bowcaster. Bowcasters covers\nbasic marksmanship. Advanced Bowcaster includes more complicated tactical\ncombat situations. Bowcaster Mastery involves rigorous combat training. Elite\nShiaWook Fastclaws are usually the only practitioners of Bowcaster Mastery.\n\nAdditional Help Files: AMMO","s":["Use of the skill is automatic once learned."],"r":[],"l":50,"c":"Combat"},"dodge":{"d":"Level 55 Combat Skill\n\nA combatant learns to anticipate the flows of combat. Their instincts are\nsharply honed, allowing soldiers to completely avoid blows that might\notherwise hit. This skill lets you dodge incoming attacks, taking no damage\nfrom them.","s":["Use of the skill is automatic once learned."],"r":[],"l":55,"c":"Combat"},"disarm":{"d":"Level 60 Combat Skill\n\nThe canny soldier knows combat is not solely about brute power. When in close\ncombat, Disarm allows you to knock a weapon from your opponents hands. You\nMUST HAVE A WEAPON EQUIPPED to perform this action.","s":["disarm"],"r":[],"l":60,"c":"Combat"},"dual wield":{"d":"Level 70 Combat Skill\n\nThe elite soldier learns to eliminate any weakness from their defense.\nNeither hand is dominant and you can use weapons in both hands.\nThis can be any combination your character is strong enough to wield.\nThis skill gives you an additional attack each round.","s":["Use of the skill is automatic once learned."],"r":[],"l":70,"c":"Combat"},"gouge":{"d":"Level 75 Combat Skill\n\nA trained soldier has the opportunity to cause additional damage in combat by\ngouging their enemy.","s":["gouge"],"r":[],"l":75,"c":"Combat"},"berserk":{"d":"Level 80 Combat Skill\n\nGoing berserk sends your warrior into a frenzied state, increasing its attacks\nper round by one and your strength by one. While in a berserk frenzy, you\ncannot flee or retreat combat, nor can you rescue another being.","s":["berserk"],"r":[],"l":80,"c":"Combat"},"enhanced damage":{"d":"Level 80 Combat Skill\n\nThis skill increases the damage you inflict when attacking. Enhanced Damage\napplies to all forms of attack. The degree of improvement is determined by\nyour skill in Enhanced Damage.","s":["Use of the skill is automatic once learned."],"r":[],"l":80,"c":"Combat"},"mines":{"d":"Level 85 Combat Skill\n\nAllows a soldier to conceal a landmine where it is most likely to be tripped by\nan enemy. To plant the mine, drop it on the ground and type mines <name of\nmine>. Tripping a mine can destroy a ship if placed inside and stumbled over\nby an unaware boarder.","s":["mines <object>"],"r":[],"l":85,"c":"Combat"},"grip":{"d":"Level 90 Combat Skill\n\nGrip helps you resist being disarmed by your opponent. The success compares\nyour skill in GRIP to your opponents skill in DISARM. You gain skill through\nyour opponent's attempts to disarm you.\n\nIt is also effective against some Force abilities.","s":["Passive use"],"r":[],"l":90,"c":"Combat"},"unarmed combat":{"d":"UNARMED_COMBAT\n\nLevel 100 Combat Skill: Unarmed Combat\nLevel 100 Bounty Hunting Skill: Advanced Unarmed\nLevel 120 Bounty Hunting Skill: Unarmed Mastery\n\nThese skills increase proficiency without weaponry. Unarmed Combat covers basic\nattacks, parries, grabs and throws. Advanced Unarmed includes much more\ncomplicated combat maneuvers. Unarmed Mastery involves secret techniques only\npassed from master to apprentice. These skills are often known only to\nassassins, as most high-risk targets have stringent security measures that\npreclude carrying weapons within striking distance.","s":["Use of the skill is automatic once learned."],"r":[],"l":100,"c":"Combat"},"hitall":{"d":"Level 105 Combat Skill\n\nWith extensive experience, a soldier can carefully gain strategic positioning\nprior to combat. This advantageous spot will allow the soldier to snap off a\nsingle shot at every opponent in the area. Use this skill with care however,\nas it starts a fight.\n\nIf you accidentally shoot another player, flee immediately and apologize. If\nthey do not accept and attack or kill you as a sign of revenge, tell an Imm\nand we will take care of it. But please do not lie, if you really typed hitall\non purpose, then you deserved whatever happened.","s":["hitall"],"r":[],"l":105,"c":"Combat"},"blaster mastery":{"d":"Level 1 Combat Skill: Blasters\nLevel 45 Combat Skill: Advanced Blasters\nLevel 105 Combat Skill: Blaster Mastery\n\nBlasters are ranged weapons that fire laser bolts. They are common throughout\nthe galaxy, ranging from palm-concealed sporting blasters to the planet\ndestroying Death Star cannon. Each of these skills increase proficiency with\nthe blaster. Blasters covers basic marksmanship. Advanced Blasters includes\nmore complicated tactical combat situations. Blaster Mastery involves\nrigorous, long-term combat training. Elite troops like the clone ARC Troopers\nare usually the only practitioners of Blaster Mastery. Blasters are most\ncommonly created by engineers using the makeblaster command.","s":["Use of the skill is automatic once learned."],"r":[],"l":105,"c":"Combat"},"forcepike mastery":{"d":"Level 20 Combat Skill: Force Pikes\nLevel 45 Combat Skill: Advanced Forcepike\nLevel 110 Combat Skill: Forcepike Mastery\n\nThe forcepike is a 2 meter long pike with a vibro-edged head. Due to its size\nand pacification capibilities, the force pike has found greater use in\nmilitias and police forces.\n\nThese skills increase proficiency with force pikes. Force Pikes covers basic\nattacks, parries and ripostes. Advanced Forcepike includes more complex combat\nmaneuvers. Elite commando forces like the Emperor's Royal Guard are usually the\nonly practitioners of Forcepike Mastery.","s":["Use of the skill is automatic once learned."],"r":[],"l":110,"c":"Combat"},"aim":{"d":"Level 115 Combat Skill\n\nThis skill will cause your character (assuming you are wielding a weapon) to\ntarget a specific body part on someone. Refer to the help file on WOUNDS for\nmore information. When you aim at someone, your first shot (assuming you\nwere not in combat when you aimed) will have a 66% better chance at hitting the\ntarget location. A 'headshot', where you aim at the victim's head, will deal\n10x damage if successful.\n\nThe following body parts can be aimed at in combat:\nHead, Neck, Back,\nLeft/Right Arm, Left/Right Wrist, Left/Right Hand,\nLeft/Right Leg, Left/Right foot\n\nEach location has a different chance to hit or miss, depending on logic. Arms\nand legs are easier to hit than hands and wrists. Likewise, the head is the\nhardest spot to hit on the whole body. After your first shot, your percentage\nto hit will be based off your percentage in AIM.\n\nDexterity of both persons involved, as well as their luck will play a role in\ndeciding a hit or miss. It is possible to hit someone in the target location\nand not wound them. All wounds will be accompanied by a message indicating that\nyou have wounded the target.","s":["aim <target> <body part>","aim none"],"r":[],"l":115,"c":"Combat"},"bowcaster mastery":{"d":"Level 25 Combat Skill: Bowcasters\nLevel 50 Combat Skill: Advanced Bowcaster\nLevel 115 Combat Skill: Bowcaster Mastery\n\nA curious combination of modern and ancient technologies, the bowcaster is the\ntraditional weapon of the Wookiee. While seeming anachronistic to those\naccustomed to blasters, a bowcaster is extremely deadly in the hands of a\nskilled Wookiee warrior.\n\nEach of these skills increase proficiency with the Bowcaster. Bowcasters covers\nbasic marksmanship. Advanced Bowcaster includes more complicated tactical\ncombat situations. Bowcaster Mastery involves rigorous combat training. Elite\nShiaWook Fastclaws are usually the only practitioners of Bowcaster Mastery.\n\nAdditional Help Files: AMMO","s":["Use of the skill is automatic once learned."],"r":[],"l":115,"c":"Combat"},"blastdoor":{"d":"Level 140 Combat Skill\n\nA soldier receives advanced training in demolitions. This skill covers\nthe placement, tamping and arming of mines to destroy a door. Blastdoor\nrequires a mine in your inventory. The setting for BLASTDOOR\nis different than the MINE skill is and will not injure people in\nthe room even if it fails.\n\nThe blastdoor command has an option timer argument that allows you to\ndetermine the number of rounds before the charge is activated.","s":["blastdoor <direction>","blastdoor <direction> (timer)"],"r":[],"l":140,"c":"Combat"},"flurry":{"d":"Level 150 Combat Skill\n\nThis will unleash a flurry of attacks. The technique to learn this is a very\nLONG and ARDUOUS path to follow, but is rewarding. Great masters of the combat\nart can unleash a devastating seven attacks, enough to even kill some\nsentients.","s":["flurry (while in combat)"],"r":[],"l":150,"c":"Combat"},"navigation":{"d":"It is an automatic skill.\n\nSee also Help coordinates. help hyperspace , help course","s":[],"r":[],"l":1,"c":"Piloting"},"ship systems":{"d":"Level 1 Piloting Skill\n\nThis command allows you to check the status of your spacecraft's systems,\nor that of another ship.","s":["Status","Status (Shipname)"],"r":[],"l":1,"c":"Piloting"},"small spacecraft":{"d":"No help on 'small spacecraft' found. Opening only similar helpfile.\n\"SMALL_SPACECRAFT\" \"MEDIUM_SPACECRAFT\" \"CORVETTE_SPACECRAFT\" \"LARGE_SPACECRAFT\"\n \"HEAVY_SPACECRAFT\"\n\nLevel 1 Piloting Skill\n\nSmall Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nsmall size. These are vehicles, fighter ships, and transports.\n\nLevel 55 Piloting Skill\n\nMedium Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nmedium size. These are freighters and gunboats.\n\nLevel 85 Piloting Skill\n\nCorvette Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\ncorvette size. These are corvettes.\n\nLevel 100 Piloting Skill\n\nLarge Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nlarge size. These are frigates and cruisers.\n\nLevel 130 Piloting Skill\n\nHeavy Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nheavy size. These are battleships, battlestations, and platforms.\n\nHaving any of these skills researched does not override any of the others.","s":[],"r":[],"l":1,"c":"Piloting"},"weapon systems":{"d":"This skill allows you to use the various weapon systems on a spacecraft.","s":["Passive"],"r":[],"l":1,"c":"Piloting"},"space combat 1":{"d":"All the space combat skills add to your probability to hit another ship with\nyour weapon systems.","s":["Passive"],"r":[],"l":10,"c":"Piloting"},"dock":{"d":"Level 20 Piloting Skill\n\nThis skill is used to align two spacecraft in a docking maneuver. To initiate\nthe docking procedure, a pilot of sufficient skill must be in range of the\ntarget ship. If the target is disabled, it's a public shuttle, you're set as\nthe target ship's owner/pilot/copilot, or it's a clan-owned ship and you have\nappropriate piloting empowerments, no code argument is needed.\n\nCapital-class spacecraft can only dock with ships of equal or larger size.\nNon-capitals can dock with ships one size smaller, or any ship equal to or\nlarger than them.\n\nWhen docked with another ship, you can use the board command at the hatch to\ntransfer over.","s":["dock <target shipname> [<docking code>]"],"r":[],"l":20,"c":"Piloting"},"fly":{"d":"Level 30 Piloting Skill\n\nThe 'fly' skill will allow you to fly your SMALL size ship around a planet\nlike you would drive a vehicle.\n\nYou first need to LAUNCH HOVER your ship and then you can FLY through any\nnormal exit as long as the exit is not indoors. Unlike vehicles, your ship's\nheadlights are always on allowing you to light up rooms you fly over. Make\nsure to LAND your ship before you exit as you can fall out and be unable to\nenter without flying yourself.","s":["Launch Hover","Fly <Direction>","Land"],"r":[],"l":30,"c":"Piloting"},"tractor beams":{"d":"Level 35 Piloting Skill\n\nThis skill gives a player the ability to manipulate the ship's controls so that\nits tractor-beams can be used affect other objects in space. A skilled operator\nmay use the tractor-beams to draw in a ship into the hangar, alter its course\nand speed, and capture cargo pods. The higher the percentage of this skill, the\nbetter the chance of its success.\n\nUse the cargo argument to force a disabled freighter to jettison all of its\ncargo.","s":["tractorbeam <ship> capture <bay #>","tractorbeam <ship> halt","tractorbeam <ship> cargo","tractorbeam <cargo pod>","tractorbeam <ev suit> (only on rescue ships)"],"r":[],"l":35,"c":"Piloting"},"ship maintenance":{"d":"Level 50 Piloting Skill\n\nShip Systems: --------\n Fuel      - Halts a fuel purge (see HELP SABOTAGE)\n Drive     - Repairs the ship's drive\n Launcher  - Repairs the missile launcher\n Laser     - Repairs the lasers\n Ion       - Repairs the ion cannons\n Cloak     - Repairs the cloaking system\n Turret    - Repairs a turret\n Comm      - Repairs the ship's comm system\n Tractor   - Repairs the tractor beam\n\nShip maintenance grants a pilot the ability to use the repairship command.\nTo repair a ship, one must be in the relevant room of the ship - either the\nengine room, or the one that houses that particular ship system.","s":["repairship <system>"],"r":[],"l":50,"c":"Piloting"},"medium spacecraft":{"d":"No help on 'medium spacecraft' found. Opening only similar helpfile.\n\"SMALL_SPACECRAFT\" \"MEDIUM_SPACECRAFT\" \"CORVETTE_SPACECRAFT\" \"LARGE_SPACECRAFT\"\n \"HEAVY_SPACECRAFT\"\n\nLevel 1 Piloting Skill\n\nSmall Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nsmall size. These are vehicles, fighter ships, and transports.\n\nLevel 55 Piloting Skill\n\nMedium Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nmedium size. These are freighters and gunboats.\n\nLevel 85 Piloting Skill\n\nCorvette Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\ncorvette size. These are corvettes.\n\nLevel 100 Piloting Skill\n\nLarge Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nlarge size. These are frigates and cruisers.\n\nLevel 130 Piloting Skill\n\nHeavy Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nheavy size. These are battleships, battlestations, and platforms.\n\nHaving any of these skills researched does not override any of the others.","s":[],"r":[],"l":55,"c":"Piloting"},"roll":{"d":"Level 65 Piloting Skill\n\nA skilled pilot can override the system of a starfighter, enabling the pilot to\nescape from projectiles that may be following his vessel. Exceptionally skilled\npilots capable of ship dodging are able to even break target locks on their\nship.\n\nPlease note: Usage of this ability can damage your ship. A pirate's lock cannot\nbe broken in this way.\n\nWhen coupled with shipdodge, roll will allow a pilot to escape tractor beam\ncapture attempts and nullifies the effects of a tractor beam halt, letting them\nspeed back instantly up at the cost of fuel.","s":["Roll"],"r":[],"l":65,"c":"Piloting"},"mobile refuel":{"d":"No help on 'mobile refuel' found. Opening only similar helpfile.\nMOBILE_REFUEL\nLevel 75 Piloting Skill\n\nUsed in conjunction with a fuel canister you are holding, this skill allows\nthe user to refuel a ship from the engine room using only the \"refuel\"\ncommand. This is a timed channel skill that gradually transfers fuel from\nthe canister to the ship.\n\nNote that only one person can be refueling the ship at any given time using\na fuel canister.","s":["refuel"],"r":[],"l":75,"c":"Piloting"},"shipdodge":{"d":"This skill will automatically factor in the ability of the pilot of a\nship under fire. Use of the PILOT command is essential to the inclusion of\nthis skill's benefits into the scheme of space combat. A ship that is smaller\nthan its target can hit it more, and is much less likely to be hit when\nshot in retaliation.\n\nDoes not function for ships Cruiser size and greater.\n\nThis skill enhances the ROLL skill by adding a chance to break target locks on\nyour ship.\n\nHELP ROLL","s":["Passive"],"r":[],"l":80,"c":"Piloting"},"corvette spacecraft":{"d":"No help on 'corvette spacecraft' found. Opening only similar helpfile.\n\"SMALL_SPACECRAFT\" \"MEDIUM_SPACECRAFT\" \"CORVETTE_SPACECRAFT\" \"LARGE_SPACECRAFT\"\n \"HEAVY_SPACECRAFT\"\n\nLevel 1 Piloting Skill\n\nSmall Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nsmall size. These are vehicles, fighter ships, and transports.\n\nLevel 55 Piloting Skill\n\nMedium Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nmedium size. These are freighters and gunboats.\n\nLevel 85 Piloting Skill\n\nCorvette Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\ncorvette size. These are corvettes.\n\nLevel 100 Piloting Skill\n\nLarge Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nlarge size. These are frigates and cruisers.\n\nLevel 130 Piloting Skill\n\nHeavy Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nheavy size. These are battleships, battlestations, and platforms.\n\nHaving any of these skills researched does not override any of the others.","s":[],"r":[],"l":85,"c":"Piloting"},"large spacecraft":{"d":"No help on 'large spacecraft' found. Opening only similar helpfile.\n\"SMALL_SPACECRAFT\" \"MEDIUM_SPACECRAFT\" \"CORVETTE_SPACECRAFT\" \"LARGE_SPACECRAFT\"\n \"HEAVY_SPACECRAFT\"\n\nLevel 1 Piloting Skill\n\nSmall Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nsmall size. These are vehicles, fighter ships, and transports.\n\nLevel 55 Piloting Skill\n\nMedium Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nmedium size. These are freighters and gunboats.\n\nLevel 85 Piloting Skill\n\nCorvette Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\ncorvette size. These are corvettes.\n\nLevel 100 Piloting Skill\n\nLarge Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nlarge size. These are frigates and cruisers.\n\nLevel 130 Piloting Skill\n\nHeavy Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nheavy size. These are battleships, battlestations, and platforms.\n\nHaving any of these skills researched does not override any of the others.","s":[],"r":[],"l":100,"c":"Piloting"},"space combat 2":{"d":"All the space combat skills add to your probability to hit another ship with\nyour weapon systems.","s":["Passive"],"r":[],"l":100,"c":"Piloting"},"heavy spacecraft":{"d":"No help on 'heavy spacecraft' found. Opening only similar helpfile.\n\"SMALL_SPACECRAFT\" \"MEDIUM_SPACECRAFT\" \"CORVETTE_SPACECRAFT\" \"LARGE_SPACECRAFT\"\n \"HEAVY_SPACECRAFT\"\n\nLevel 1 Piloting Skill\n\nSmall Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nsmall size. These are vehicles, fighter ships, and transports.\n\nLevel 55 Piloting Skill\n\nMedium Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nmedium size. These are freighters and gunboats.\n\nLevel 85 Piloting Skill\n\nCorvette Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\ncorvette size. These are corvettes.\n\nLevel 100 Piloting Skill\n\nLarge Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nlarge size. These are frigates and cruisers.\n\nLevel 130 Piloting Skill\n\nHeavy Spacecraft\nThis skill is a passive skill that makes a pilot able to fly vessels flagged as\nheavy size. These are battleships, battlestations, and platforms.\n\nHaving any of these skills researched does not override any of the others.","s":[],"r":[],"l":130,"c":"Piloting"},"space combat 3":{"d":"All the space combat skills add to your probability to hit another ship with\nyour weapon systems.","s":["Passive"],"r":[],"l":150,"c":"Piloting"},"makeclothing":{"d":"Level 1 Engineering Skill\n\nRequired Items: Cloth or Leather and Sewing Kit\n\nThis ability allows engineers to sew together clothing. Clothes give no stat\nbonus other than what the material used gives, and most people will wonder why\nyou're walking around naked if you don't have clothes.","s":["makeclothing <wear location> <name>"],"r":[],"l":1,"c":"Engineering"},"makecontainer":{"d":"Level 1 Engineering Skill\n\nRequired Items: Fabric and a Sewing Kit\n\nThis skill allows you to make containers that may be worn on various places on\nthe body.\n\nCaution: You could not reasonably expect to hide items inside a chunk of\ndurasteel, a thin dress belt, or a fishing pole. Please do not directly copy\ngame items that are known to not be containers. Be reasonable when making\ncontainers.","s":["makecontainer <wear location> <container name>"],"r":[],"l":1,"c":"Engineering"},"makecanteen":{"d":"Level 4 Engineering Skill\n\nRequired Items: Durasteel(preferred) or Duraplast, and a toolkit.\n\nThis skill allows you to make water-holding canteens. Upon completion, the\ncanteen must be filled.","s":["makecanteen <canteen name>"],"r":[],"l":4,"c":"Engineering"},"makecircuit":{"d":"Level 6 Engineering Skill\n\nRequired Items: Blank circuit board, Silicon gel, and a toolkit.\n\nThis skill allows you to make a circuit board, which is then used in the\ncrafting of various other items.","s":["makecircuit <name of blank circuit>"],"r":[],"l":6,"c":"Engineering"},"makeflashlight":{"d":"Level 9 Engineering Skill\n\nRequired Items: Battery, Lens, Circuit and a Toolkit\n\nThis skill allows you to craft a flashlight that will illuminate dark areas\nwhen used.","s":["makeflashlight <flashlight name>"],"r":[],"l":9,"c":"Engineering"},"makeholster":{"d":"Level 10 Engineering Skill\n\nRequired Items: Cloth or leather, Duraplast, and a Toolkit\n\nThis will let you make a custom holster that you can wear on your waist\nand store weapons in.","s":["makeholster <holster name>"],"r":[],"l":10,"c":"Engineering"},"makecomlink":{"d":"Level 13 Engineering Skill\n\nRequired Items: Battery, Circuit, Crystal, Superconductor and a Toolkit.\n\nThis skill allows an engineer to craft a comlink to communicate with others\nover a distance.\n\nLevel 25 engineering is required to make encrypted comlinks.","s":["makecomlink <wear location> <comlink name>"],"r":[],"l":13,"c":"Engineering"},"makegoggles":{"d":"Level 15 Engineering Skill\n\nRequired Items: Battery, Circuit, Duraplast, Lens, an Oven and a Toolkit\n\nThis skill allows an engineer to create a pair of infrared goggles which bestow\nupon the user the \"detect_hidden\" affect, letting them notice mobs and players\nusing the hide skill.","s":["makegoggles <goggles name>"],"r":[],"l":15,"c":"Engineering"},"repairarmor":{"d":"Level 20 Engineering Skill\n\nAn engineer utilizing this skill can repair any damaged piece of armor or\ncontainer no matter where they are - All that is required is a sewing kit.\nThe time it takes to repair a piece depends on the engineer's skill and the\namount of damage the armor has taken.","s":["repairarmor <armor name>"],"r":[],"l":20,"c":"Engineering"},"repairdoor":{"d":"Level 20 Engineering Skill\n\nRequired Items: Durasteel, Toolkit\n\nOnce a door is broken via blastdoor, breach, doorbash, or doorcut, the door\ncannot be closed or locked again until the area is reset. To avoid security\nrisks, an engineer is able to repair the door before a reset occurs.","s":["repairdoor <direction>"],"r":[],"l":20,"c":"Engineering"},"repairweapon":{"d":"Level 25 Engineering Skill\n\nRequired Items: oil, duraplast, toolkit\n\nAn individual utilizing this skill can repair any damaged weaponry no matter\nwhere they are - All that is required is oil, duraplast, and a toolkit. The\ntime it takes to repair a weapon depends on the individual's skill and the\namount of damage to the weapon.","s":["repairweapon <weapon name>"],"r":[],"l":25,"c":"Engineering"},"makedatapad":{"d":"Level 30 Engineering Skill\n\nRequired Items: Circuit, Superconductor, Battery, Duraplast, an Oven and\na toolkit\n\nThis skill allows an engineer to create a personalized datapad.","s":["makedatapad <name>"],"r":[],"l":30,"c":"Engineering"},"makejewelry":{"d":"Level 30 Engineering Skill\n\nRequired Items: Precious Metal, an Oven and a Toolkit.\nOptional Items: Crystal\n\nThis ability allows engineers to make jewelry. Crystals can be added, but are\nnot required - only their cost value will be added to the item, not any\nstats or affects.","s":["makejewelry <wear location> <name>"],"r":[],"l":30,"c":"Engineering"},"enhancearmor":{"d":"Level 32 Engineering Skill\n\nRequired Items: Armor, Coating/Underlay, Sewing Kit\n\nThis ability allows an engineer to enhance a piece of armor by adding an\nunderlay\nor coating. To enhance a piece of armor with an underlay, the armor must be\nunfinished. Enhancing with a coating can be done before or after a piece is\nfinished.","s":["enhancearmor <armor> <underlay/coating>"],"r":[],"l":32,"c":"Engineering"},"repairstructure":{"d":"Level 40 Engineering Skill\n\nRequired Item(s): Damaged Structure, Hull, Hydrospanner\n\nThis skill allows an engineer to repair any hull damage to a structure.","s":["repairstructure <structure>"],"r":[],"l":40,"c":"Engineering"},"gemcutting":{"d":"Level 45 Engineering Skill\n\nRequired Items: Crystal ore, a Toolkit\n\nThis ability allows engineers to refine raw crystal ore into a crystal usable\nfor blasters, lightsabers, or jewelry.","s":["gemcutting <new crystal name>"],"r":[],"l":45,"c":"Engineering"},"makeblade":{"d":"Level 45 Engineering Skill\n\nRequired Items: Durasteel, Battery, Superconductor, Circuit, an Oven and a\nToolkit.\n\nThis ability allows an engineer to create a custom vibro-blade in a workshop.","s":["makeblade <blade name>"],"r":[],"l":45,"c":"Engineering"},"repairhatch":{"d":"Level 50 Engineering Skill\n\nRequired Items: A broken hatch, Hull, a Toolkit\n\nLightsabers and fusion cutters can cut a ship's hatch open, rendering it\nunable to launch - this skill allows an engineer to repair said hatch.","s":["repairhatch <ship name>"],"r":[],"l":50,"c":"Engineering"},"tuneship":{"d":"Level 50 Engineering Skill\n\nThis skill will tune a ship, adding additional quota for upgrades. The amount\nof quota added depends on the size of the ship and the engineering level of the\nplayer tuning it.","s":["tuneship <ship name>"],"r":[],"l":50,"c":"Engineering"},"repairhull":{"d":"Level 55 Engineering Skill\n\nRequired Items: Damaged Ship, Hull/Durasteel, Hydrospanner, Toolkit\n\nThis skill allows an engineer to repair any hull damage to a landed spacecraft.\n\nNote: This command does use durasteel, behind-the-scenes, so valuable armor\ncomponents can go bye bye. Best to stow these away.","s":["repairhull <ship>"],"r":[],"l":55,"c":"Engineering"},"repairdroid":{"d":"Level 60 Engineering Skill\n\nRequired Items: Droid parts\n\nThis skill will use up a droid part in your inventory to repair damage to a\ndroid. You can heal any droid this way, not just your own.","s":["repairdroid <droid>"],"r":[],"l":60,"c":"Engineering"},"makeforcepike":{"d":"Level 65 Engineering Skill\n\nRequired Items: Battery, Circuit, Superconductor, Durasteel, an Oven and a\nToolkit.\n\nThis skill allows an engineer to create a personalized forcepike. Forcepikes\nare extremely heavy and only the strongest of beings can wield them.","s":["makeforcepike <name>"],"r":[],"l":65,"c":"Engineering"},"makeblaster":{"d":"Level 67 Engineering Skill\n\nRequired Items: Duraplast, Battery, Circuit, Superconductor, Ammunition,\n1-3 Crystals, an Oven and a Toolkit\n\nThis skill allows an engineer to create a customized blaster. Using different\nitems will yield different blasters. Experiment and find the best formula!\n\nBlaster classes are a way to diversify the use of blasters by breaking them up\ninto three categories: Rifle, Repeater and Pistol. The differences are rather\nsimple, but offer a nice contrast for both the person making the weapon and the\nperson using it.\n\nPISTOLS - These weapons function exactly like regular blasters used to. They\nare the single-handed weapons that are used by civilians and the military.\nThey have the least amount of bonuses and lowest damage rating.\n\nRIFLES - With the aid of a scope, you are able to hit targets from further\naway. These two-handed weapons are often used by military because they allow\nmany people to make an accurate shot on a target. Based on the power of the\nscope, the hitroll bonus of the weapon will increase. Overall damage is also\nincreased when compared to a pistol made with the same components.\nRequired: A Scope.\n\nREPEATERS - Rapid fire weapons have always been the epitome of suppressing\nfire. While they aren't as accurate as other blasters, they are very good for\nlaying down a lot of damage all at once. For this reason they are mostly\nrestricted to military use, though not all governments disallow their usage.\nRequired: A Cooling Unit.\n\nNote: The makeblaster skill will only use three crystals if there are three\ndifferently-named blaster crystals in your inventory, and if there are, then it\nwill automatically use them.","s":["makeblaster <repeater/pistol/rifle> <blaster name>"],"r":[],"l":67,"c":"Engineering"},"makelandmine":{"d":"Level 75 Engineering Skill\n\nRequired Items: Drink Container, Battery, Circuit, Chemicals, Toolkit\n\nThis allows an engineer to make a custom landmine in a workshop.\n\nWarning: A crafting failure can cause the landmine to explode!","s":["makelandmine <mine name>"],"r":[],"l":75,"c":"Engineering"},"makegrenade":{"d":"Level 80 Engineering Skill\n\nRequired Items: Drink Container, Battery, Circuit, Chemicals, Toolkit\n\nThis allows an engineer to make a custom grenade in a workshop. Using different\nchemicals will yield different results. Experiment and find the best formula!\n\nWarning: Failure can cause injury!","s":["makegrenade <grenade name>"],"r":[],"l":80,"c":"Engineering"},"upgradeship":{"d":"Level 85 Engineering Skill\n\nRequired Items: Toolkit, Hydrospanner\n\nThis skill allows an engineer to modify an existing ship. The target ship\nmust be landed inside a garage. An engineer may only modify a ship that\nthey are either the owner, pilot, or copilot of.\n\nThe 'limits' option prints out the ship's current stats and the range of\npossible values, as well as the size and cost of each component.\n\nUsing 'all' instead of a number will add or remove all possible components to a\nship, up to the ship's maximum or minimum values for it. If the ship doesn't\nhave enough quota to fit the maximum of a component, this command will instead\nadd whatever fits.\n\nStripship is used by an unscrupulous engineer to strip a starship for parts and\nsell the parts on the black market. The engineer must have stolen ship rights\nto strip it for parts. Pilots can protect their ships by hiring a skilled\nslicer to secure a ships system. Stripping a ships parts will set its stats to\nthe minimum values. The amount of credits you receive from stripping a ship\ndepends on your science skills.","s":["upgradeship <ship> <component> <amount>","dismantle <ship> <component> <amount>","upgradeship <ship> limits","upgradeship <ship> <component> all","dismantle <ship> <component> all","stripship <ship> (must be in a room flagged blackmarket)"],"r":[],"l":85,"c":"Engineering"},"makebowcaster":{"d":"Level 90 Engineering Skill\n\nRequired Items: Circuit, Superconductor, Battery, Duraplast, Bowcaster Bolt,\nan Oven and a Toolkit (Optional: A Scope)\n\nThis skill will create a traditional Wookiee weapon, the bowcaster.\nThe engineer may also add an optional scope to the bowcaster. Do be\nadvised, these weapons are heavy and require an above average level\nof strength to wield.\n\nOnly Wookiees may research the makebowcaster skill in a Library.","s":["makebowcaster <name>"],"r":[],"l":90,"c":"Engineering"},"makearmor":{"d":"Level 100 Engineering Skill\nSyntax(creation): makearmor <material> <about/head> <cover/nocover> <name>\nSyntax(after creation): makearmor <armor name>\n\nRequired Items: Fabric/Duraplast/Durasteel, Sewing Kit\n\nAfter you've created your armor, using the above syntax, it will show in your\ninventory with an (unfinished) tag. Examining the piece of armor will give you\nthe amount of times the command must be entered before the armor will be\ncomplete. The tag will go away once the armor is completed.\n\nArmor Classes:\nClass I armor is `light` armor, it gives low HP bonuses but doesn't lower your\ndexterity. It is made using FABRICS as the primary component.\n\nClass II armor is `medium` armor, it gives moderate HP bonuses as well as a\npenalty to your dexterity while worn. It is made using DURAPLAST.\n\nClass III armor is `heavy` armor, and it gives the best overall HP bonus. It\nalso gives the best AC coverage out of all the armor types. It is made using\nDURASTEEL.\n\nSimply making the armor with MAKEARMOR isn't enough, you will need to add an\nUNDERLAY and a COATING in order to make the best armor. They will add anything\nfrom HP bonuses to stat bonuses with underlays, and will add resistances to\ncertain forms of attack. Your skill percentage in several science knowledges\nwill be the determining factor in how good the armor is when you finish it.\n\nUnderlays and coatings must be added PRIOR to completing the suit of armor.\nMaking armor gives the option of making it COVER. Doing so with the head\nlocation will make it cover eyes and ears. Making it with the about location\nwill make it cover all locations like the OVER location does, except for the\nover location itself.\n\nWith the system comes added support for certain special types of armor that\nwill, when worn with both the about and head section, will change how you will\nappear to others. An example would be someone appearing as `An Imperial\nStormtrooper`.\n\nFor the Jedi ability 'armor', see: HELP ARMOR_SPELL\n\nRESTRING, ARMOR_CLASS","s":[],"r":[],"l":100,"c":"Engineering"},"buildstructure":{"d":"Level 110 Engineering Skill\n\nRequired Item(s): Structure Schematics, Structure Components\n\nHolding a set of structure schematics in their hands and using the\nbuildstructure command with no arguments will allow an engineer to attempt to\ncreate a scaffolding for a structure. The type of structure created is based\noff of the schematics.\n\nOnce scaffolded, an engineer may add parts to the structure. Each structure\nrequires a different part of each of the five structure components: Duraplast,\ndurasteel, metal, stone, and wood.\n\nThe structure becomes habitable only once completely built, and may be\ninteracted with primarily through the upkeep command.","s":["buildstructure","buildstructure <structure name> <component>"],"r":[],"l":110,"c":"Engineering"},"upgradedroid":{"d":"Level 120 Engineering Skill\n\nCommand Choices: Focus, Behavior\n\nFocus: Picking a focus for your droid is like picking a class. Combat droids\ncan fight and help you in that sense. Industry droids can help you build ships.\nTranslation droids will help you by translating any language into your own and\nvice versa. You must select one of these three things as your focus.\n\nBehavior: The behavior of a droid determines a few things about how it\ninteracts with you and other people. Behaviors are: ignore, destroy, assist and\ninactive. When you create your droid it will start inactive. You will have to\nchange its behavior to either ignore or assist to get it to start helping you.","s":["upgradedroid <command> <option>"],"r":[],"l":120,"c":"Engineering"},"imbue":{"d":"This command allows you to imbue the special properties of the rare cortosis\nore into a weapon that has already been created. You must have the ore and your\nitem in your inventory when you use it.","s":["imbue <weapon to imbue>"],"r":[],"l":125,"c":"Engineering"},"makedroid":{"d":"Level 130 Engineering Skill\n\nThis skill will allow an engineer to make a droid. Engineers are allowed ONE\nDROID ONLY. If you want to have a different type of droid you will have to\ndestroy your current droid and make a new one.\n\nBody type                    Hp   str   dex   int\nCylinder             |     1000|     |  +10|  +5\nBiped                |     3000|   +5|   +3|  +4\nQuadruped            |     7000|   +7|   -4|\n\nDifferent body types require different amounts of durasteel and duraplast.\n\nBody type          Durasteel Duraplast\nCylinder          |     3  |     20|\nBiped             |     5  |     25|\nQuadruped         |     8  |     50|\n\nIndustry droids assist with building ships. They reduce the time needed to\ncomplete the BUILDSHIP skill by up to 1/3 depending on the droid's level.\n\nTranslation droids can be ordered to translate everything into a language its\nmaster chooses.\n\nThe droid may be controlled via the DUTY command. Droids save with your player\nfile and will disappear when you log out. Droids can and will die, and when\nthey do you will have to make a new one. Droids can level up, and they do so by\nhelping you or performing certain tasks. The higher their level the more they\ncan help.\n\nUse DROIDSTAT to see detailed information about your droid.\n\nDESTROYDROID, CLANDROID, DESCDROID","s":["makedroid <type>"],"r":[],"l":130,"c":"Engineering"},"restring":{"d":"Level 130 Engineering Skill\n\nThis is used to set the description you assume when wearing both a covering\nhelmet and a covering suit of body (about) armor, or to completely change\nthe string of a piece of uppermost layer armor or container to have a custom\nappearance.\n\nRestrings for covering armor are subject to strict guidelines:\n- The armor could be worn by any character, so avoid character-specific\n  attributes like age, race, gender, and size.\n- You must align the restring with the class of armor. Armor made with cloth\n  should not be restrung as \"a being in heavy armor\".\n- Avoid terms which other characters in the game wouldn't know. That includes\n  concepts outside the Star Wars universe or references to canon which isn't\n  currently ingame.\n\nFailure to follow these requirements could result in your character being\ndisallowed from using the skill.\n\nExamples of Bad Covering Armor Restrings:\nA being in an elegant dress - Dresses do not hide a person's identity\nA man in a pair of overalls - What if a woman wears it? Don't include gender.\nA human in a business suit  - Has species in it. A Jawa could put it on.\nSomeone in a suit of armor  - Uses the special keyword Someone.\n\nYou will also notice that none of these are actually armor.","s":["restring <covering about armor> <description>","restring <upper layer armor/container> <new string>"],"r":[],"l":130,"c":"Engineering"},"buildship":{"d":"Level 135 Engineering Skill\n\nBuildship is a skill engineers get, and they use it to build a ship from a\nblueprint that they come into possession of. Buildship does not allow the\nengineer to make a FULLY CUSTOM SHIP, modify room desc/names, flags, or any\nother builder-like functions. The blueprints are ships PRE-APPROVED by the\nImmortals, and the ship will be the same as any other ship (minus TUNING and\nUPGRADING).\n\nWith a ship blueprint in hand:\n\nbuildship\nbuildship clan\n\nWith no arguments, this will create the frame for the ship described in a\nblueprint you hold in your hands.\n\nWith the optional 'clan' argument, the ship frame will be owned by your clan\ninstead of you. This is required for frigates or larger.\n\nbuildship <frame> <part>\n\nAssuming you have the part, this will add the part to the frame. If you want to\nsee how much is left on the frame, EXAMINE it.\n\nMultiple Engineers can work on a frame, in fact ANY engineer can. The owner of\nthe ship will ALWAYS be whomever created the frame from the blueprint.\n\nThe parts are: HULL, CIRCUITS, ENGINES and WEAPONS.\n\nIf you are an engineer by trade, when you EXAMINE the blueprint or the ship, it\nwill tell you how much the blueprint needs. It also reminds you of the names of\neach part, as you must input the exact name of each part when you buildship.\n\nEach component used to build the ship has an impact value set onto it. The\nhigher the impact value, the more impact the component has to building your\nship. You will want to use components that have the highest value possible. You\ncan determine the impact value of a component by examining the ship as you\nbuild it.","s":["buildship","buildship clan","buildship <ship frame> <part>"],"r":[],"l":135,"c":"Engineering"},"doorbash":{"d":"Level 25 Bounty Hunting Skill\n\nHandy for getting rid of closed, locked doors - Although some doors\nare bashproof.\n\nWarning: Doorbashing hurts and can damage gear!","s":["Doorbash (direction)"],"r":[],"l":25,"c":"Bounty hunting"},"tradebounty":{"d":"Level 25 Bounty Hunting Skill\n\nThe tradebounty skill is used to turn over a bountied target to the person who\nplaced said bounty. The target must be grabbed and bound. When the skill is\nused, the hunter will release the target, the receiver will grab them, and the\ncredits will be transferred.\n\nThe clantradebounty empowerment will allow individuals to receive a target\nplaced by the clan.","s":["tradebounty <target> <receiver>"],"r":[],"l":25,"c":"Bounty hunting"},"claimbounty":{"d":"Level 30 Bounty Hunting Skill\n\nThis skill will allow a bounty hunter to perm a victim by bypassing\nhospitalization. No amount of credits can protect a player that has been\nbountied, and a bounty on the victim is a requirement.","s":["claimbounty <stunned bountied player>"],"r":[],"l":30,"c":"Bounty hunting"},"poison_weapon":{"d":"No help on 'poison_weapon' found. Opening only similar helpfile.\n'POISON WEAPON'\nLevel 55 Bounty Hunting Skill\n\nPoison weapon is a skill, unique to bounty hunters, which enables them to coat\nthe tip of their weapon with a deadly poison. In battle, this poison will cause\nill effects on its recipient. Be warned however, it has been told that poison\nhas a strong lessening effect on the lifetime of weapons. To poison a weapon,\nyou must have the weapon, poison, and a full water container in your\n inventory.---------------------------","s":["'poison weapon' <weapon>"],"r":[],"l":55,"c":"Bounty hunting"},"track":{"d":"Level 55 Bounty Hunting Skill\n\nTrack will assist you in tracking down a mob that is within the area,\ngiving you its general direction. This can also be used to track\nother players.","s":["track <mob>"],"r":[],"l":55,"c":"Bounty hunting"},"limber":{"d":"Level 80 Bounty Hunting Skill\n\nThis bounty hunting ability gives the user a bonus of +5 dexterity for a\nduration that depends on their percentage in the skill. This is handy for\nbeating armor penalties.","s":["limber"],"r":[],"l":80,"c":"Bounty hunting"},"sprint":{"d":"CommNet 0 [A being in dragon armor]( gruffly ): Well, this miasma stuff is just so much\n fun\nLevel 80 Bounty Hunting Skill\n\nA hunter is often in good shape, and can run very quickly over short distances.\nSprinting uses a lot of movement points (700), and only last for a few rounds,\nbut can help a hunter catch his quarry or evade pursuers.","s":["sprint"],"r":[],"l":80,"c":"Bounty hunting"},"true_examine":{"d":"Level 80 Bounty Hunting Skill\n\nBounty hunters must be very keen of eye in order to spot their prey. Through\nextreme practice and training, this skill allows a bounty hunter to see through\ndisguises and allow them to ascertain their quarry's true race.","s":["true_examine <target>"],"r":[],"l":80,"c":"Bounty hunting"},"backstab":{"d":"Level 85, 95 Bounty Hunting Skills\n\nBackstab is a bounty hunting skill that will start a fight with whoever\nyou backstab. To backstab someone, you must be wielding a piercing weapon\nand have already approached your victim.\n\nCircle is also a bounty hunting skill, not unlike backstab. The difference\nbeing that you must already be fighting to circle someone. Again, you must\nbe wielding a piercing weapon and have already approached your victim.","s":["backstab <victim>","circle <victim>"],"r":[],"l":85,"c":"Bounty hunting"},"circle":{"d":"Level 85, 95 Bounty Hunting Skills\n\nBackstab is a bounty hunting skill that will start a fight with whoever\nyou backstab. To backstab someone, you must be wielding a piercing weapon\nand have already approached your victim.\n\nCircle is also a bounty hunting skill, not unlike backstab. The difference\nbeing that you must already be fighting to circle someone. Again, you must\nbe wielding a piercing weapon and have already approached your victim.","s":["backstab <victim>","circle <victim>"],"r":[],"l":95,"c":"Bounty hunting"},"advanced unarmed":{"d":"UNARMED_COMBAT\n\nLevel 100 Combat Skill: Unarmed Combat\nLevel 100 Bounty Hunting Skill: Advanced Unarmed\nLevel 120 Bounty Hunting Skill: Unarmed Mastery\n\nThese skills increase proficiency without weaponry. Unarmed Combat covers basic\nattacks, parries, grabs and throws. Advanced Unarmed includes much more\ncomplicated combat maneuvers. Unarmed Mastery involves secret techniques only\npassed from master to apprentice. These skills are often known only to\nassassins, as most high-risk targets have stringent security measures that\npreclude carrying weapons within striking distance.","s":["Use of the skill is automatic once learned."],"r":[],"l":100,"c":"Bounty hunting"},"vibroblade mastery":{"d":"Level 1 Combat Skill: Vibro-blades\nLevel 40 Combat Skill: Advanced Vibroblades\nLevel 100 Bounty Hunting Skill: Vibroblade Mastery\n\nVibroblades house a sonic generator in the hilt, causing the blade to vibrate.\nThe wounds caused penetrate much deeper than might otherwise be the case.\nThese skills increase proficiency with vibroblades. Vibro-blade covers basic\nattacks, parries and ripostes. Advanced Vibroblades includes the most complex\ncombat maneuvers known to the public. Vibroblade Mastery involves secret\ntechniques only passed from master to apprentice.","s":["Use of the skill is automatic once learned."],"r":[],"l":100,"c":"Bounty hunting"},"retreat":{"d":"Level 110 Bounty Hunting Skill\n\nA bounty hunter with control of the battlefield can use their exceptional\nawareness to allow themselves an orderly withdrawal. Retreat enables a bounty\nhunter to choose which direction they flee from combat, instead of randomly\nchoosing a direction in which to run. Like flee, a hunter cannot retreat past a\nblocked exit.","s":["retreat <direction>"],"r":[],"l":110,"c":"Bounty hunting"},"unarmed mastery":{"d":"UNARMED_COMBAT\n\nLevel 100 Combat Skill: Unarmed Combat\nLevel 100 Bounty Hunting Skill: Advanced Unarmed\nLevel 120 Bounty Hunting Skill: Unarmed Mastery\n\nThese skills increase proficiency without weaponry. Unarmed Combat covers basic\nattacks, parries, grabs and throws. Advanced Unarmed includes much more\ncomplicated combat maneuvers. Unarmed Mastery involves secret techniques only\npassed from master to apprentice. These skills are often known only to\nassassins, as most high-risk targets have stringent security measures that\npreclude carrying weapons within striking distance.","s":["Use of the skill is automatic once learned."],"r":[],"l":120,"c":"Bounty hunting"},"lunge":{"d":"Level 125 Bounty Hunting Skill\n\nThis skill will make a hunter lunge at their target and try to hit them with\nwhatever melee weapons (forcepike, vibroblade) they have drawn. If you miss a\nlunge you will be lagged out slightly. If you do not miss, you will be near\nyour target and will start full combat.","s":["lunge <target>"],"r":[],"l":125,"c":"Bounty hunting"},"enhanced tracking":{"d":"No help on 'enhanced tracking' found. Opening only similar helpfile.\nENHANCED_TRACKING\n\nLevel 130 Bounty Hunting Skill\n\nIf your target is on a ship or in a structure, enhanced tracking allows you to\nfind the room the entryway is in. If your target is on a different floor of a\nnearby lift, you will be able to track them to the call button on your\n floor!---------------------------","s":["Use of the skill is included in 'track' once learned."],"r":[],"l":130,"c":"Bounty hunting"},"jetpack mastery":{"d":"A skilled bounty hunter becomes better at integrating jetpacks with their existing equipment. Penalties involved in flying while in combat are reduced.","s":["Automatic in combat while wearing jetpacks."],"r":["ENERGIZE"],"l":"140","c":"Bounty hunting"},"integrated optics":{"d":"This level 145 bounty hunter skill will lessen the penalty from wearing goggles\nin combat.","s":["N/A"],"r":[],"l":145,"c":"Bounty hunting"},"ambush":{"d":"Level 150 Bounty Hunting Skill\n\nHidden, unseen, the stealthy hunter can unleash an awesome attack on the\nunsuspecting. Doing a random amount between 100 hitpoints and 40% of the max HP\nof the victim, this can turn the tide of battle. In order to execute an ambush,\nyou must be unseen.","s":["ambush <target>"],"r":[],"l":150,"c":"Bounty hunting"},"beg":{"d":"Level 1 Smuggling Skill\n\nThe beg skill is simply that... begging. Useful for gaining starting cash for a\ncharacter.","s":["Beg <mob>"],"r":[],"l":1,"c":"Smuggling"},"dig":{"d":"Level 1 Smuggling Skill\n\nYou can dig and bury items through the use of the dig skill and bury command.\nBuried items are not visible to players, even through the use of powers such as\nsharp eye. To dig an item up, type dig with no arguments. Digging requires\none of the many shovel items available in-game. If you dig in a direction,\nyou will attempt to dig open an exit or hidden passageway.\n\nTo bury an item (or corpse), drop the item on the ground and bury <item>.\nDepending on the size and weight of the object, you might need a shovel.\n\n* Note:  Deadly players can bury/dig up each other's corpses. *\n\nItems buried will not last beyond crash or reboot - do not attempt to use\nthis skill for storage of items you wish to keep.","s":["dig","dig  <direction>","bury <item>"],"r":[],"l":1,"c":"Smuggling"},"search":{"d":"Level 3 Smuggling Skill\n\nSometimes not all items are in clear view.  Some items may be concealed or\nhidden, and will require some searching to find.","s":["search","search <container>"],"r":[],"l":3,"c":"Smuggling"},"climb":{"d":"Level 7 Smuggling Skill\n\nThis skill enables you to climb into and out of rooms that require it.\nYou can also just type the direction you wish to move. If that direction\nrequires climbing, it will automatically attempt to climb.","s":["climb  <direction>"],"r":[],"l":7,"c":"Smuggling"},"slip":{"d":"Level 10 Smuggling Skill\n\nThis skill allows a player to pass an object to another player or mob\nwithout others or the target noticing. The higher your skill, the more\nlikely you'll be able to slip something to someone unnoticed.","s":["Slip <object> <target>"],"r":[],"l":10,"c":"Smuggling"},"hide":{"d":"General Command: Visible\n\nIf you successfully HIDE, other characters and creatures cannot see you\nunless they are affected by 'detect hidden'.\n\nIf you successfully SNEAK, you can move from place to place without being\nnoticed by other characters. This will give you the \"sneaking around\" action\nmessage that is visible to other players if they see you in a room.\n\nIn order to HIDE or SNEAK successfully, you must practice the appropriate\nskill.\n\nVISIBLE cancels your hiding and sneaking, as well as any invisibility,\neffectively making you visible again to all. Those who can SILENT\nSNEAK will be able to cancel their sneak via this command without\nprompting an echo, so long as they are not also hidden or\ninvisible.","s":["hide","sneak","visible"],"r":[],"l":15,"c":"Smuggling"},"peek":{"d":"Level 20 Smuggling Skill\n\nThis skill shows you a character's inventory when you look at a character.\nYou must be close to the character in order to peek into their inventory.","s":["usage of this skill is automatic once learned"],"r":[],"l":20,"c":"Smuggling"},"steal":{"d":"Level 40 Smuggling Skill\n\nSTEAL attempts to steal credits or an object from a mob or another player.\nThere are penalties for using STEAL on other players. In order to STEAL\nsuccessfully, you must practice the skill.","s":["steal <object/credits> <character>"],"r":[],"l":40,"c":"Smuggling"},"spice refining":{"d":"Spice is the illicit drug of choice in the Star Wars galaxy. Smugglers can\nrefine raw spice into a product that players can consume for different buffs in\ncombat at the expense of having potentially severe side effects. The more spice\na character consumes, the more blood toxicity they gain. As the benefits from\nspice wear off, side effects kick in based on your toxicity level. Side effects\ncan range from temporary blindness and gradual loss of health to instant\nincapacitation. Taking more spice can temporarily stave off the symptoms, but\ntheyll be even worse when they come back!\n\nThe affected command will display both your spice buff and any withdrawal\nsymptoms after the spice wears off.\n\nSpice comes in many types, and has two values: Potency and toxicity. Potency\ndetermines how long the buff lasts, and toxicity measures how much the spice\npoisons you. Some spice will give minor buffs while poisoning you for a short\nwhile, and some can give a significant boost but are much more toxic.\n\nMastery of the NARCOTICS science will allow smugglers to refine spice with\nsubstantially lower toxicity. They will also be able to see a spices potency\nand toxicity when examining it.","s":["MAKESPICE <rawspice> <finished product's name>","takedrug <spice name>"],"r":[],"l":50,"c":"Smuggling"},"palm":{"d":"Palm and Tuck are new skills rolled together under the palm skill. Palm is a\nsilent get (can be used out of a container or off the ground). Tuck is a silent\nput and is rolled into the palm skill. Just type tuck and it's based off palm.\n\nAlso, a sidenote, you need to be in the room with someone else to get a % in\nthese skills.","s":["Palm <item>","Or: Palm <item> <container>","Tuck <item> <container>"],"r":[],"l":65,"c":"Smuggling"},"disguise":{"d":"Level 90 Smuggling skill\n\nAccess to this skill grants you several slots to customize in order to build up\na disguise via the DISGUISE CREATE and DISGUISE EDIT commands. A character's\nstrength, charisma, skincolor and race can be adjusted. Attempting to edit\nthese attributes with no value will return a range of valid values available to\nthe would be disguiser. A disguise's name is name of the new persona, and the\ntitle is the equivalent of a PUBLIC TITLE for that persona. When you introduce\nyourself, via GREET AS command, as the name of your disguise the set Title will\nbe shown. Please note, it is one thing to make a new persona, it is quite\nanother to copy other character names. Don't do the latter as it causes many\nissues.\n\nOnce the disguise slot is built up as desired, DISGUISE SAVE command will lock\nit into place. Once a disguise is saved, it can no longer be changed via the\nDISGUISE EDIT commands. When in the disguise, however, the DESCRIPTION and\nPUBLIC TITLE can be adjusted.\n\nThe number of disguises you can save is limited, so be careful when creating\nand saving new ones. Once it has been saved, you're stuck with it.\n\nDISGUISE APPLY is used to put on a disguise via a single item of PUTTY. Once\napplied, you will appear as your disguise. At this time, it is suggested that\nyou change your description via the DESCRIPTION command. Any changes to the\ndescription while IN the disguise will save to the disguise, as will any\nchanges to the PUBLIC TITLE. When you remove the disguise, both description and\npublic title will revert to what they were in your undisguised state. All dubs\nand greets while disguised will save to the disguise, even if you remove it and\nreapply it later. The people who you greeted, or who dubbed you, will retain\nthe greet/dub to that specific disguise.\n\nDisguises have a chance to come off in fights when you take damage. Anytime a\ndisguise is abandoned or forced off in this manner, it will fall to the ground\nin scraps. Possibly notifying others in the area that there was someone running\naround in a disguise.\n\nDESCRIPTION, HELP TITLE","s":["Disguise","Disguise list","Disguise create","Disguise apply <ID>","Disguise edit <ID> <str/cha/race/title/name/skincolor> <value>","Disguise save","Disguise remove"],"r":[],"l":90,"c":"Smuggling"},"pick ship lock":{"d":"Level 90 smuggling skill\n\nThis allows you to open the hatch on anothers ship. Be warned, some mobs\nmight get offended at the attempt and will alert others as well as start to\nattack you.","s":["pick <ship name>"],"r":[],"l":90,"c":"Smuggling"},"hijack":{"d":"Level 100 Smuggling Skill\n\nHIJACK is a command used from the pilot seat of any ship. If this ship is owned\nby you, if you are assigned as pilot/copilot of it, or if it is a clan ship and\nyou have pilot clearance, it will not work. It is used by a smuggler to\noverride the codes on the ship to allow the initiation of the engines, much\nlike hot wiring a car. Be forewarned! If you hijack a ship that is owned by\nyour enemy clan, and your clan's ships that are set to fire on enemy clan ships\non sight see you, you will be in for a rough ride.","s":["hijack"],"r":[],"l":100,"c":"Smuggling"},"thieves eye":{"d":"Level 110 Smuggling Skill\n\nThis skill, for a master smuggler, can let him or her notice when\nanother is trying to steal their items. Once adepted, this skill is far\nmore powerful than even at 99%.","s":["usage of this skill is automatic once learned."],"r":[],"l":110,"c":"Smuggling"},"sneak":{"d":"General Command: Visible\n\nIf you successfully HIDE, other characters and creatures cannot see you\nunless they are affected by 'detect hidden'.\n\nIf you successfully SNEAK, you can move from place to place without being\nnoticed by other characters. This will give you the \"sneaking around\" action\nmessage that is visible to other players if they see you in a room.\n\nIn order to HIDE or SNEAK successfully, you must practice the appropriate\nskill.\n\nVISIBLE cancels your hiding and sneaking, as well as any invisibility,\neffectively making you visible again to all. Those who can SILENT\nSNEAK will be able to cancel their sneak via this command without\nprompting an echo, so long as they are not also hidden or\ninvisible.","s":["hide","sneak","visible"],"r":[],"l":115,"c":"Smuggling"},"trafficking":{"d":"Level 120 Smuggling Skill\n\nWhats a smuggler without the ability to smuggle? LOTJs smuggling system\nfunctions similarly to the cargo commands, but has its own risks and rewards.\nProfessional smugglers can trade in contraband to skip needing a cargo pass,\npaying local clan taxes, and avoid trade embargos.\n\nNo smuggler is perfect. Failing the skill check (trafficking) when buying or\nselling contraband runs the risk of alerting the authorities, possibly leading\nto you being WANTED on the planet and attacked by local police. What determines\na successful smuggle attempt? A better skill percentage will make your day\neasier. High planetary police budgets, customs agents and platform security\nwill not.","s":["buycontraband <ship> <type> <amount>","sellcontraband <ship> <type> <amount>"],"r":[],"l":120,"c":"Smuggling"},"pirateship":{"d":"Level 145 Smuggling Skill\n\nPIRATESHIP will allow a master smuggler to steal a ship.\n\nA person may only ever have one `stolen` ship. The ship will not be owned by\nthe person, though it will appear in SHIPS OWNED. The real owner of the ship\ncan still see it, as the posession of the ship never changes.\n\nGoverning clans (and do-gooder slicers) can enact security on landing pads,\nwhich will set off the planet's governing clan alarms if a pirateship attempt\nis made there. Likewise, nefarious slicers can disable security.\n\nSmugglers who successfully steal a ship can then use TRADESHIP <ship> <target>\nto trade stolen rights of that ship to someone else. Still, it's only one\nstolen ship per character. Smugglers can trade stolen ships to crime clantypes.\nThe number of stolen ships a crime clan can maintain is based on its number of\nactive members.\n\nTo relinquish your hold on a ship, you can either PIRATESHIP RELEASE to release\nyour claim from anywhere, or use TRADESHIP <ship> NONE (while in the room with\nthe ship). You will not be able to see or set codes of the ship, or self\ndestruct it, but autopilot and launching, as well as other goodies will work\nwhile it is stolen.","s":["pirateship","pirateship release <ship name>"],"r":[],"l":145,"c":"Smuggling"},"escape_binding":{"d":"Level 150 Smuggling Skill\n\nThis skill is a master level smuggling skill. It lets the smuggler escape, even\nwhen bound with the strongest binding available. Failure can lead to detection,\nbut not always. Must use skill to gain in skill percentage. Requires some of\nthe user's movement points in order to work, but it consumes none.","s":["escape_binding"],"r":[],"l":150,"c":"Smuggling"},"slowdraw":{"d":"Level 150 Smuggling skill\n\nA keen smuggler can ease their weapon from its holster without anyone else in\nthe room noticing, drawing and shooting first for a single high-damage shot on\nan unsuspecting target. It may take a minute or two, but this skill can provide\na keen advantage in certain situations. Interrupting a slowdraw or failing at\nthe skill results in a regular 'draw', visible to everyone in the room.\n\nOnly pistols can be slow-drawn.","s":["slowdraw <target>"],"r":[],"l":150,"c":"Smuggling"},"call":{"d":"This skill allows the user to summon a message drone to deliver a datadisk and\npackage to someone. Beginning at level 35, great leaders can call upon\nfollowers to assist them in a variety of ways. Mercenaries, field medics, post\nguards, or simple reinforcements are all available types. Some other followers\nmay be called, depending on the character's position in a clan (if they are in\none) and their leadership level. You can order your followers around (See HELP\nORDER) and they will follow you until you dismiss them (See HELP DISMISS), or\nyou do something to cause them to doubt your leadership and possibly even\nattack you. If you leave them unattended for long enough, called followers\nwill wander off and disappear.","s":["call <race name> <type>","call message drone"],"r":[],"l":1,"c":"Leadership"},"research":{"d":"Level 1 Leadership Skill\n\nThis skill allows a player to increase the percentage level of their skills.\nEach successful attempt will increase the skill by a % depending on your\nintelligence level. Skills cannot be researched past 90%.\n\nYou must be in a library to use the research command. Also, be aware there\nare limitations on how far you can research a skill, depending on what level\nyou received that skill at, and what level you are currently.\n\nIf you are 3+ levels above the level needed to learn the skill, your skill %\nwill jump directly to 90% (except for very difficult skills such as\nslice/secure, flurry, and the sciences).","s":["Research <skill/language>"],"r":[],"l":1,"c":"Leadership"},"teach":{"d":"Level 1 Leadership Skill\n\nIf you are 100% adept in a skill, you have the ability to teach it to another\nplayer. If someone offers to teach you something, you may either accept or deny\nteach accept\nit.\n\nThe effectiveness of 'teach' depends on your leadership level, with a bonus for\nleader mains teaching a skill within their subclass.","s":["teach <person> <skill>","teach <accept/deny>"],"r":[],"l":1,"c":"Leadership"},"makefood":{"d":"Level 5 Leadership Skill\n\nRequired Items: Cookware and 1-3 ingredients\n\nThis skill allows you to cook customized meals with ingredients you\nsource from around the galaxy. These meals can be used for roleplay\npurposes but may also have some added health benefits. These meals\ncan have custom descriptions.","s":["makefood <name>"],"r":[],"l":5,"c":"Leadership"},"makedrink":{"d":"Level 10 Leadership Skill\n\nRequired Items: Cookware and 1 to 3 ingredients.\n\nThis skill allows you to prepare custom drinks with ingredients you\nsource from around the galaxy. These drinks can be used for roleplay\npurposes but may also offer some unique effects depending on the\ningredients you use. If your drink container is a custom-made\ncanteen, you can also set that container's desription.","s":["makedrink <drink container> <drink name>"],"r":[],"l":10,"c":"Leadership"},"jail":{"d":"Level 25 Leadership Skill\n\nWhen in a clan, this skill will send a stunned target to the local clan jail.","s":["jail <person>"],"r":[],"l":25,"c":"Leadership"},"smalltalk":{"d":"Level 30, 70 and 110 Leadership Skills\n\nThese are three leadership skills which allow them to manage public opinion on\nplanets. Public opinion is important for maintaining control over a world or\nwhen trying to capture a planet diplomatically.\n\nSmalltalk will reveal details of the current public opinion of the given\ngovernment clan as well as their current military presence. Any citizen or\nvendor mob can be used. Using this skill, you'll even see which effects are\ncontributing to public opinion so you know how to best respond to them.\n\nAt a cost of 1,000 credits, this command can be used defensively to bolster\npublic opinion or offensively to get police out of the way and increase crime.\nIf used on a citizen, it will raise opinion of the current government by 0.1.\nIf used on a police mob, the police mob will go away and crime rating will go\nup by 1/3 of a point.\n\nPropaganda allows experienced leaders to sway public opinion however they like.\nIt will raise or lower support by 1/4 of a point with each use, although it may\nfail to convince the target, especially for players with low charisma.\n\nNotes:\n* Mobs will despawn when targeted with bribe or propaganda. To continue your\nefforts, you may need to wait for more mobs to spawn, which happens every 20\nminutes for planetary AI mobs.","s":["smalltalk <citizen/vendor> <clan>","bribe <target>","propaganda <citizen> <for/against> <clan>"],"r":[],"l":30,"c":"Leadership"},"bribe":{"d":"Level 30, 70 and 110 Leadership Skills\n\nThese are three leadership skills which allow them to manage public opinion on\nplanets. Public opinion is important for maintaining control over a world or\nwhen trying to capture a planet diplomatically.\n\nSmalltalk will reveal
